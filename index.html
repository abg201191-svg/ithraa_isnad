<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لياقة أشواق</title>
<meta name="description" content="برنامج تمارين منزلية لثمانية أسابيع بالدمبلات: أربع جلسات أسبوعياً حتى 40 دقيقة، بجهد خفيف وتركيز على استقامة الكتفين والرقبة والورك.">
<meta name="theme-color" content="#fff9f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1718" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="لياقة أشواق">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Readex+Pro:wght@300..700&display=swap">
<style>:root{color-scheme:light}html{scroll-padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* تصميم: واجهة هادئة. خلفية حجرية دافئة، حبر داكن، لون واحد خافت، خطوط رفيعة بدل الظلال، وشاشة واحدة لكل مهمة. */
:root{
  --f-body:"Readex Pro","Tajawal","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Aref Ruqaa","Amiri","Noto Naskh Arabic",serif;
  --ev-s:#2f7d4f;--ev-m:#2f6aa3;--ev-l:#a8741a;--ev-g:#7a5fa5;
  --warn:#f8ecd4;--warn-ink:#6b4410;
  --shadow:0 8px 24px rgba(40,25,30,.18);
  --sh:0 1px 2px rgba(90,45,60,.05),0 10px 28px rgba(90,45,60,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ev-s:#6fcf94;--ev-m:#7db5ee;--ev-l:#e3b45f;--ev-g:#b9a0e8;
  --warn:#3a2f17;--warn-ink:#f0d8a0;
  --shadow:0 8px 24px rgba(0,0,0,.5);--sh:none;
}}
:root[data-theme="dark"]{
  --ev-s:#6fcf94;--ev-m:#7db5ee;--ev-l:#e3b45f;--ev-g:#b9a0e8;
  --warn:#3a2f17;--warn-ink:#f0d8a0;
  --shadow:0 8px 24px rgba(0,0,0,.5);--sh:none;
}
:root{--acc:#be3f64;--on-acc:#ffffff;--soft:#fde7ee;--soft-ink:#8f2548;--bg:#fff9f9;--s2:#fbeef1;--line:#f2dfe4;--ink:#2b2024;--muted:#665a60;--surface:#ffffff;--h1:#ffdfe8;--h2:#efe1ff}
:root[data-pal="lilac"]{--acc:#7249b8;--on-acc:#ffffff;--soft:#f0e9fb;--soft-ink:#4b2a85;--bg:#fbf9ff;--s2:#f3eefa;--line:#e6ddf3;--ink:#271f33;--muted:#625a70;--surface:#ffffff;--h1:#e9defd;--h2:#ffe0ee}
:root[data-pal="sage"]{--acc:#2f7d6b;--on-acc:#ffffff;--soft:#e3f5ee;--soft-ink:#1c5546;--bg:#f7fcf9;--s2:#edf6f1;--line:#d9eadf;--ink:#1f2a26;--muted:#566660;--surface:#ffffff;--h1:#d5f2e5;--h2:#e3ecff}
:root[data-pal="sand"]{--acc:#9a6a10;--on-acc:#ffffff;--soft:#fbf0d9;--soft-ink:#6b4708;--bg:#fffcf5;--s2:#f8f1e2;--line:#eee3cb;--ink:#2b2518;--muted:#665c46;--surface:#ffffff;--h1:#ffeac6;--h2:#ffe0dd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--acc:#e58aa2;--on-acc:#2f0f19;--soft:#3a2a2e;--soft-ink:#f2c4d0;--bg:#1b1718;--s2:#2f292a;--line:#3b3435;--ink:#f4eeea;--muted:#c3b8bb;--surface:#252021;color-scheme:dark}:root:not([data-theme="light"])[data-pal="lilac"]{--acc:#b79af0;--on-acc:#1f1238;--soft:#332b45;--soft-ink:#dccffa;--bg:#18151c;--s2:#2c2733;--line:#38323f;--ink:#f1edf6;--muted:#bdb5c9;--surface:#221e28}:root:not([data-theme="light"])[data-pal="sage"]{--acc:#7fcdb8;--on-acc:#08261f;--soft:#233630;--soft-ink:#c4eadf;--bg:#131715;--s2:#252c29;--line:#2f3835;--ink:#eaf2ee;--muted:#aab8b2;--surface:#1c2220}:root:not([data-theme="light"])[data-pal="sand"]{--acc:#d9b36a;--on-acc:#2a1f08;--soft:#382f1d;--soft-ink:#efdcae;--bg:#1a1812;--s2:#2e2a21;--line:#3a352a;--ink:#f3eee2;--muted:#bfb7a4;--surface:#24211a}}
:root[data-theme="dark"]{--acc:#e58aa2;--on-acc:#2f0f19;--soft:#3a2a2e;--soft-ink:#f2c4d0;--bg:#1b1718;--s2:#2f292a;--line:#3b3435;--ink:#f4eeea;--muted:#c3b8bb;--surface:#252021;color-scheme:dark}
:root[data-theme="dark"][data-pal="lilac"]{--acc:#b79af0;--on-acc:#1f1238;--soft:#332b45;--soft-ink:#dccffa;--bg:#18151c;--s2:#2c2733;--line:#38323f;--ink:#f1edf6;--muted:#bdb5c9;--surface:#221e28}
:root[data-theme="dark"][data-pal="sage"]{--acc:#7fcdb8;--on-acc:#08261f;--soft:#233630;--soft-ink:#c4eadf;--bg:#131715;--s2:#252c29;--line:#2f3835;--ink:#eaf2ee;--muted:#aab8b2;--surface:#1c2220}
:root[data-theme="dark"][data-pal="sand"]{--acc:#d9b36a;--on-acc:#2a1f08;--soft:#382f1d;--soft-ink:#efdcae;--bg:#1a1812;--s2:#2e2a21;--line:#3a352a;--ink:#f3eee2;--muted:#bfb7a4;--surface:#24211a}

/* ألوان الهيرو في الوضع الداكن */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--h1:#43303a;--h2:#33294a}:root:not([data-theme="light"])[data-pal="lilac"]{--h1:#3a3052;--h2:#4a2f43}:root:not([data-theme="light"])[data-pal="sage"]{--h1:#244036;--h2:#26334a}:root:not([data-theme="light"])[data-pal="sand"]{--h1:#46391f;--h2:#46302d}}
:root[data-theme="dark"]{--h1:#43303a;--h2:#33294a}
:root[data-theme="dark"][data-pal="lilac"]{--h1:#3a3052;--h2:#4a2f43}
:root[data-theme="dark"][data-pal="sage"]{--h1:#244036;--h2:#26334a}
:root[data-theme="dark"][data-pal="sand"]{--h1:#46391f;--h2:#46302d}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 var(--f-body);font-weight:400;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 112px;overflow-wrap:anywhere}
body.sessmode{padding-block:0 140px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc);font-weight:600}
h1,h2,h3,h4,p,ol,ul{margin:0}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:10px}
.app{max-width:560px;margin:0 auto}
.muted{color:var(--muted)}
.sm{font-size:14px}
.xs{font-size:13px}
.b{font-weight:700}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px}
.wrap{flex-wrap:wrap}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:12px}
.mt{margin-top:20px}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.logo{font-family:var(--f-display);font-size:26px;line-height:1.3;font-weight:700;color:var(--acc);background:none;border:0;padding:0}
.icobtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--s2);display:grid;place-items:center;color:var(--ink)}
.icobtn svg{width:22px;height:22px}

/* type */
.h1{font-size:28px;line-height:1.4;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.h2{font-size:21px;line-height:1.5;font-weight:700;text-wrap:balance}
.h3{font-size:17px;line-height:1.5;font-weight:600}
.cap{font-size:13px;font-weight:600;color:var(--muted);margin:30px 0 10px}
.eyebrow{font-size:14px;color:var(--muted)}

/* buttons */
.btn{appearance:none;border:0;border-radius:16px;padding:0 22px;min-height:54px;font-weight:600;font-size:17px;background:var(--acc);color:var(--on-acc);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.quiet{background:var(--s2);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.s{min-height:42px;padding:0 16px;font-size:14.5px;border-radius:12px}
.btn.full{width:100%}
.btn svg{width:20px;height:20px;flex:none}
.btn:active{opacity:.85}
.link{background:none;border:0;padding:8px 0;color:var(--acc);font-weight:600;min-height:44px;font-size:15px}

/* groups and rows */
.group{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.gi{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:64px;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:start}
.group>.gi:first-child{border-top:0}
.gi .t{font-weight:600;font-size:16px;line-height:1.5}
.gi .m{font-size:13.5px;color:var(--muted);line-height:1.6}
.stat{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;background:none;padding:0}
.stat svg{width:16px;height:16px}
.stat.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.stat.part{border-color:var(--acc)}
.chev-l{width:18px;height:18px;color:var(--muted);flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}
.today{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px}
.today .t{font-size:24px;line-height:1.45;font-weight:700;text-wrap:balance}
.dots{display:flex;gap:6px}
.dots i{width:30px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--acc)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:3px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:13px;color:var(--muted);background:none;white-space:nowrap}
button.tag{cursor:pointer}
.tag.ev-strong::before,.tag.ev-mid::before,.tag.ev-low::before,.tag.ev-logic::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ev-s)}
.tag.ev-mid::before{background:var(--ev-m)}
.tag.ev-low::before{background:var(--ev-l)}
.tag.ev-logic::before{background:var(--ev-g)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:13px;color:var(--muted);background:none;white-space:nowrap}
button.chip{cursor:pointer}
.chip.ev-strong::before,.chip.ev-mid::before,.chip.ev-low::before,.chip.ev-logic::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ev-s)}
.chip.ev-mid::before{background:var(--ev-m)}
.chip.ev-low::before{background:var(--ev-l)}
.chip.ev-logic::before{background:var(--ev-g)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;min-height:44px;padding:0 18px;font-weight:600;font-size:15px}
.pill:active{background:var(--s2)}

/* week selector */
.wk{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
@media (max-width:359px){.wk{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}}
.wkc{width:100%;max-width:46px;aspect-ratio:1;justify-self:center;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;padding:0;position:relative}
.wkc.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wkc.dn::after{content:"";position:absolute;bottom:4px;inset-inline:0;margin:auto;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.wkc.on.dn::after{background:var(--bg)}
.pips{display:flex;gap:8px}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.pip svg{width:14px;height:14px}
.pip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.cdots{display:flex;gap:6px}
.cd{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.cd.on{background:var(--acc);border-color:var(--acc)}

/* walking */
.walk{display:flex;flex-direction:column;gap:12px;padding:16px}

/* ===== session ===== */
.stop{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);padding:8px 0 10px}
.stop .r{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stop .ttl{background:none;border:0;padding:6px 0;text-align:center;font-size:14px;color:var(--muted);min-height:44px}
.sprog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.sprog>i{display:block;height:100%;background:var(--acc)}
.sbody{display:flex;flex-direction:column;gap:20px;padding-top:12px}
.where{font-size:14px;color:var(--muted)}
.st-title{font-size:32px;line-height:1.4;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.st-target{font-size:22px;font-weight:600;color:var(--acc)}
.kgbox{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 12px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.kgb{display:flex;align-items:center;justify-content:center;gap:12px;direction:ltr}
.kgb button{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-size:30px;line-height:1;padding:0;color:var(--acc)}
.kgb input{width:110px;border:0;background:transparent;text-align:center;font-size:44px;font-weight:700;line-height:1.2;-moz-appearance:textfield;padding:0;font-variant-numeric:tabular-nums}
.kgb input::-webkit-outer-spin-button,.kgb input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.hint{font-size:14.5px;color:var(--muted);line-height:1.8}
.hint b{color:var(--ink)}
.cue{font-size:17px;line-height:1.9}
details.how{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
details.how>summary{list-style:none;cursor:pointer;min-height:56px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:16px}
details.how>summary::-webkit-details-marker{display:none}
details.how>summary svg{width:20px;height:20px;color:var(--muted);transition:transform .2s}
details.how[open]>summary svg{transform:rotate(180deg)}
details.how>.in{display:flex;flex-direction:column;gap:18px;padding:4px 0 20px}
.in h4,.info h4{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.in ol,.in ul,.info ol,.info ul{padding-inline-start:22px;display:flex;flex-direction:column;gap:8px;font-size:15.5px;line-height:1.8}
.feel{display:flex;gap:8px}
.feel button{flex:1;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:16px}
.feel button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.lk{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);font-size:14.5px;text-decoration:none;color:var(--ink);font-weight:600}
.altbox{background:var(--s2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.next-up{font-size:15px;color:var(--muted)}
.next-up b{color:var(--ink)}
.sact{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sacti{max-width:560px;margin:0 auto;display:flex;gap:10px}
.sacti .btn{flex:1}
.sacti .btn.quiet{flex:none;min-width:84px;padding:0 16px}
.it{display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:68px;border-top:1px solid var(--line)}
.group>.it:first-child{border-top:0}
.it .nm{font-weight:600;font-size:16px;line-height:1.5}
.it .cu{font-size:14px;color:var(--muted);line-height:1.65}
.itb{display:flex;gap:6px;flex:none}
.sq{width:44px;height:44px;border-radius:12px;border:0;background:var(--s2);color:var(--ink);display:grid;place-items:center;padding:0}
.sq svg{width:20px;height:20px}
.it .ck{width:30px;height:30px}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0;color:transparent;flex:none}
.ck svg{width:16px;height:16px}
.ck.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.moves{display:flex;flex-direction:column;gap:14px;font-size:16px}
.moves .c{font-size:14px;color:var(--muted)}
.rule{font-size:15px;line-height:1.85;color:var(--muted)}
.rule b{color:var(--ink)}
.sumrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.sumrow>div{padding:16px 8px;text-align:center;border-inline-start:1px solid var(--line)}
.sumrow>div:first-child{border-inline-start:0}
.sumrow .v{font-size:26px;font-weight:700;line-height:1.3}
.sumrow .l{font-size:13px;color:var(--muted)}

/* log */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:20px}
.stats>div{padding:16px 8px;text-align:center;border-inline-start:1px solid var(--line)}
.stats>div:first-child{border-inline-start:0}
.stats .v{font-size:26px;font-weight:700;line-height:1.3}
.stats .l{font-size:13px;color:var(--muted)}
.wbars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;height:120px;padding-top:6px}
.wbar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.wbar i{display:block;width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:var(--acc);min-height:3px}
.wbar i.z{background:var(--line)}
.wbar b{font-size:13px}
.wbar small{font-size:12px;color:var(--muted)}
.wbar.cur small{color:var(--ink);font-weight:700}
.exl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.group>.exl:first-child{border-top:0}
.spark{width:96px;height:34px}
.spark polyline{fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark circle{fill:var(--acc);stroke:var(--surface);stroke-width:2}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.lbl{font-size:14px;font-weight:600}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;min-height:50px}
textarea.inp{min-height:90px;resize:vertical}
.chk{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:start;width:100%}
.group>.chk:first-child{border-top:0}
.chk .ck{margin-top:1px}

/* reference */
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;padding:0 18px;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary svg{width:20px;height:20px;transition:transform .2s;color:var(--muted);flex:none}
details.acc[open]>summary svg{transform:rotate(180deg)}
details.acc>.in{padding:0 18px 20px;display:flex;flex-direction:column;gap:14px;font-size:15.5px;line-height:1.85}
.ev{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.ev:first-child{border-top:0;padding-top:0}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th,table.tb td{text-align:start;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.tb th{font-size:13px;color:var(--muted);font-weight:600}
.tbw{overflow-x:auto}
.warn{background:var(--warn);color:var(--warn-ink);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.8}

/* timer */
.tm{position:fixed;inset-inline:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.tmin{max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);pointer-events:auto}
.tmin .t{font-size:30px;font-weight:700;line-height:1;min-width:48px;text-align:center}
.tmin .l{font-size:14.5px;font-weight:500;line-height:1.5;flex:1;min-width:0}
.tmin button{border:0;background:rgba(127,127,127,.28);color:inherit;border-radius:12px;min-height:44px;padding:0 14px;font-weight:600;font-size:14px}
.tm.big{inset:0;bottom:0;display:grid;place-items:center;background:var(--bg);pointer-events:auto;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.tmb{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.tmb .tr{position:relative;width:min(280px,72vw);aspect-ratio:1}
.tmb .tr svg{width:100%;height:100%;transform:rotate(-90deg)}
.tmb .tr .c{position:absolute;inset:0;display:grid;place-items:center}
.tmb .tr .c b{font-size:80px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.tmb .kind{font-size:14px;font-weight:600;color:var(--muted)}
.tmb .kind.work{color:var(--acc)}
.tmb .mv{font-size:30px;line-height:1.4;font-weight:700;text-wrap:balance}
.tmb .nx{font-size:15px;color:var(--muted);min-height:2.8em}
.tmb .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* sheet */
.shade{position:fixed;inset:0;background:rgba(30,20,24,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sheet .gr{width:40px;height:4px;border-radius:9px;background:var(--line);align-self:center;flex:none}
.info{display:flex;flex-direction:column;gap:16px}
.steps-l{display:flex;flex-direction:column}
.steps-l button{display:flex;align-items:center;gap:12px;min-height:50px;background:none;border:0;border-top:1px solid var(--line);text-align:start;padding:0}
.steps-l button:first-child{border-top:0}
.steps-l .rd{font-size:13px;font-weight:600;color:var(--muted);margin-top:14px}

/* nav */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:35;background:var(--bg);border-top:1px solid var(--line);padding:4px max(16px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.sessmode .nav{display:none}
.navin{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:8px 0 6px;color:var(--muted);font-size:12.5px;font-weight:500;min-height:58px}
.nb svg{width:24px;height:24px}
.nb.on{color:var(--acc);font-weight:700}

.toast{position:fixed;inset-inline:0;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
.toast span{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-size:15px;font-weight:500;box-shadow:var(--shadow)}

.pal{display:flex;gap:12px}
.pdot{width:44px;height:44px;border-radius:50%;border:3px solid var(--bg);outline:2px solid var(--line);padding:0}
.pdot.on{outline:3px solid var(--ink)}
.seg{display:flex;background:var(--s2);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:11px;min-height:44px;font-weight:600;font-size:15px}
.seg button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.gi .t,.gi .m{display:block}
.gi .m{margin-top:2px}
.covr{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.covr:first-of-type{border-top:0}
.steps-l .rd+button{border-top:0}
body.sub .top{display:none}
.stop .ttl{flex:1}
.kgbox .xs{margin-top:-2px}
.stop .ttl{display:flex;align-items:center;justify-content:center}
.card .group{border-radius:14px}

/* ----- اليوم والبطاقات ----- */
.en{display:block;direction:ltr;unicode-bidi:isolate;text-align:right;font-size:13px;color:var(--muted);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill.dn:not(.on){border-color:var(--acc);color:var(--acc)}
.lbl2{font-size:14px;font-weight:600;margin-bottom:6px}
.vbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.vbtn{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--acc);color:var(--acc);background:transparent;font-size:14px;font-weight:600;text-decoration:none}
.vbtn svg{width:14px;height:14px;flex:none}
.vbtn:active{background:var(--soft)}
.vbtn.hi{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.vbtn.hi:active{opacity:.85}
.dcard{display:flex;flex-direction:column;gap:12px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;color:var(--ink)}
.dcard.next{border:2px solid var(--acc);padding:15px}
.dcard .dh{display:flex;align-items:center;gap:14px}
.dcard .stat{width:40px;height:40px;font-size:17px;color:var(--ink)}
.dcard .stat.on{color:var(--on-acc)}
.dcard .lab{display:block;font-size:13px;color:var(--acc);font-weight:700}
.dcard .ttl{display:block;font-size:20px;font-weight:700;line-height:1.5}
.dcard .mt1{display:block;font-size:13.5px;color:var(--muted)}
.dl{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.dli{display:flex;align-items:flex-start;gap:10px;font-size:15px;line-height:1.6}
.dli i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--s2);color:var(--muted);font-style:normal;font-size:12px;display:grid;place-items:center;margin-top:2px}
.dli.more{color:var(--muted);font-size:14px}
.dcard>.bar{margin-top:0}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 14px 12px}
.excard.open{border-color:var(--acc)}
.exh{display:flex;align-items:flex-start;gap:12px;width:100%;background:none;border:0;padding:0;text-align:start;min-height:48px;color:var(--ink)}
.exm{flex:1;min-width:0;display:block}
.exm .ar{display:block;font-size:18px;font-weight:700;line-height:1.5}
.exm .sum{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.exh .chv{width:20px;height:20px;flex:none;color:var(--muted);margin-top:8px;transition:transform .2s}
.excard.open .exh .chv{transform:rotate(180deg)}
.idx{flex:none;width:36px;height:36px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:15px;font-weight:700;margin-top:2px}
.idx svg{width:18px;height:18px}
.excard.dn .idx{background:var(--acc);color:var(--on-acc)}
.exrow{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.exrow .lab{font-size:13.5px;color:var(--muted);font-weight:600}
.bub{display:flex;gap:8px;flex-wrap:wrap}
.sb{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;padding:0;display:grid;place-items:center;color:var(--muted)}
.sb svg{width:20px;height:20px}
.sb.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.exb{display:flex;flex-direction:column;gap:16px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.altc{background:var(--s2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.altl{font-size:13px;font-weight:700;color:var(--acc)}
.altn{font-size:17px;font-weight:700;line-height:1.5}
.altc ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.8}
.altc p{margin:0}
.moves .en{margin-top:0}
.moves .vbar{margin-top:6px}
.moves .vbtn{min-height:38px;font-size:13px;padding:0 12px}
.card .group{border-radius:14px}
.dsw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
.dsw .pill{padding:0 4px;text-align:center}
.altc .btn.quiet{background:var(--surface);border:1px solid var(--line)}

/* ===== v5: أفتح، شاشة رئيسية، وأقسام الجلسة بالترتيب ===== */
.card,.group,.dcard,.excard,details.acc,.kgbox,.stats,.sumrow,.today,.stg{box-shadow:var(--sh)}
.wkc.on,.pill.on,.feel button.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.wkc{background:var(--surface)}
.cap{font-size:14px;font-weight:700;color:var(--soft-ink);margin:28px 0 10px}

/* بطاقة اليوم */
.dcard{border-radius:24px;padding:16px;gap:14px}
.dcard .stat{background:var(--soft);border-color:var(--soft);color:var(--soft-ink)}
.dcard .stat.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.dcard .stat.part{border-color:var(--acc)}
.dcard.next{background:linear-gradient(160deg,var(--surface) 55%,var(--soft) 100%);border:2px solid var(--acc);padding:15px}
.dflow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dflow .fs{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--s2);border-radius:14px;padding:8px 2px 7px;text-align:center;min-width:0}
.dflow .fs i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--soft);color:var(--soft-ink);font-size:11.5px;font-weight:700;display:grid;place-items:center;margin-bottom:2px}
.dflow .fs b{font-size:12.5px;font-weight:700;line-height:1.4}
.dflow .fs em{font-style:normal;font-size:12px;color:var(--muted)}
.dl{padding-top:0;border-top:0;gap:7px}

/* أقسام الجلسة */
.tl{display:flex;flex-direction:column;gap:16px;margin-top:22px}
.stg{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;scroll-margin-top:76px}
.stg:not(:last-child)::after{content:"";position:absolute;inset-inline-start:32px;top:100%;height:16px;width:2px;background:var(--line)}
.stg.open{border-color:var(--acc);border-width:1.5px}
.stgh{display:flex;align-items:center;gap:14px;width:100%;padding:14px;background:none;border:0;text-align:start;color:var(--ink);min-height:72px;border-radius:22px}
.stgn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:17px;font-weight:700;background:var(--soft);color:var(--soft-ink)}
.stgn svg{width:20px;height:20px}
.stg.open .stgn,.stg.dn .stgn{background:var(--acc);color:var(--on-acc)}
.stgt{display:block;font-size:19px;font-weight:700;line-height:1.5}
.stgm{display:block;font-size:13.5px;color:var(--muted)}
.stgh .chv{width:20px;height:20px;color:var(--muted);flex:none;transition:transform .2s}
.stg.open .stgh .chv{transform:rotate(180deg)}
.stgb{padding:14px 14px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.stgb>.card{border:0;padding:0;background:transparent;box-shadow:none}
.stgb .group,.stgb .excard{box-shadow:none}
.stgb .group{background:var(--bg)}
.stgb .excard{background:var(--bg)}
.stgb .kgbox{background:var(--surface);box-shadow:none}
.stgb .altc{background:var(--surface)}
.stgb .altc .btn.quiet{background:var(--bg)}

/* عبارة تحفيزية أعلى الرئيسية */
.qt{margin-top:2px;padding:14px 16px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(150deg,var(--soft),var(--surface));color:var(--soft-ink);font-size:18px;font-weight:600;line-height:1.75;text-align:center;text-wrap:balance}

/* ===== v6: رأس اليوم وبطاقات الأقسام بتنسيق أنيق ===== */
.dhead{margin-top:10px;padding:20px 18px 18px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(155deg,var(--soft) 0%,var(--surface) 70%);box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
.dk{font-size:13px;font-weight:700;color:var(--acc);letter-spacing:.01em}
.dt{font-size:30px;line-height:1.4;font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin-top:-4px}
.dfocus{font-size:15px;line-height:1.8;color:var(--muted)}
.dmeta{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.dm{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.dm svg{width:15px;height:15px;color:var(--acc)}
.dprog{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.dprog .bar{height:8px;border-radius:4px;background:var(--surface);border:1px solid var(--line)}
.dprog .bar>i{border-radius:4px}
.dpl{display:flex;align-items:baseline;gap:5px;font-size:13px;color:var(--muted)}
.dpl b{color:var(--acc);font-size:15px}

.tl{gap:14px;margin-top:20px}
.stg{border-radius:24px;transition:border-color .2s,box-shadow .2s}
.stg:not(:last-child)::after{inset-inline-start:41px;height:14px;top:100%;width:2px;background:var(--line)}
.stg.open{border-color:var(--acc);border-width:1.5px;box-shadow:0 2px 6px rgba(120,40,70,.06),0 14px 32px rgba(120,40,70,.10)}
.stgh{padding:14px 16px;gap:14px;min-height:84px;border-radius:24px}
.stgn{width:56px;height:56px;border-radius:50%;position:relative;display:grid;place-items:center;flex:none;font-size:0;background:conic-gradient(var(--acc) calc(var(--p,0) * 1%),var(--line) 0)}
.stgn::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--soft)}
.stgn svg{position:relative;width:24px;height:24px;color:var(--soft-ink)}
.stg.open .stgn,.stg.dn .stgn{background:conic-gradient(var(--acc) calc(var(--p,0) * 1%),var(--line) 0)}
.stg.open .stgn::before{background:var(--soft)}
.stg.dn .stgn::before{background:var(--acc)}
.stg.dn .stgn svg{color:var(--on-acc)}
.stgk{display:block;font-size:12.5px;font-weight:700;color:var(--acc);line-height:1.5}
.stgt{font-size:19px;line-height:1.45}
.stgm{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;font-size:13px;color:var(--muted);margin-top:2px}
.stgm>span{display:inline-flex;align-items:center;gap:5px}
.stgm svg{width:14px;height:14px}
.stgh .chv{width:22px;height:22px}
.stgb{padding:16px 16px 18px;gap:16px}
.stgb>.rule{font-size:14.5px;background:var(--soft);color:var(--soft-ink);border-radius:14px;padding:10px 14px}
.stgb>.rule b{color:inherit}
.stgb .group{border-radius:18px;border:1px solid var(--line);background:var(--bg)}
.stgb .it{padding:14px 14px;gap:12px}
.stgb .it .nm{font-size:16px}
.stgb .it .cu{font-size:13.5px;line-height:1.7}
.stgb .sq{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--soft-ink)}
.stgb .ck{width:32px;height:32px;border-width:2px}
.stgb .excard{border-radius:20px;padding:14px;background:var(--surface);border:1px solid var(--line)}
.stgb .excard.open{border-color:var(--acc)}
.stgb .excard.dn{background:var(--soft);border-color:var(--soft)}
.stgb .idx{background:var(--soft);color:var(--soft-ink)}
.stgb .exrow{border-top:1px dashed var(--line)}
.stgb .sb{background:var(--surface)}
.stgb>.btn.full,.stgb .btn.full:last-child{min-height:52px;border-radius:16px}
.stgb .h3{font-size:16px;color:var(--soft-ink)}
.stgb .sb.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.it .nm .xs{white-space:nowrap}
.stgb .it .nm{line-height:1.6}
.it .dur{display:inline-block;white-space:nowrap;background:var(--soft);color:var(--soft-ink);border-radius:999px;padding:0 9px;font-size:12px;font-weight:700;line-height:1.7;margin-inline-start:4px;vertical-align:1px}
@media (max-width:359px){
  .stgb{padding:14px 12px 16px}
  .stgb .it{flex-wrap:wrap;row-gap:10px}
  .stgb .it .grow{flex:1 1 calc(100% - 50px)}
  .stgb .itb{flex:1 1 100%;padding-inline-start:44px}
  .stgh{padding:12px 12px;gap:12px}
}


/* ===== v9: سجلّي، أدواتي، المرجع، النبض ===== */
.pghead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);line-height:1.6}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok::before{background:var(--ev-s)}
.sync.wait::before{background:var(--ev-l)}
.sync.err::before,.sync.ro::before{background:var(--acc)}
.segx{margin-top:0}
.segx button{min-height:44px;font-size:14.5px;padding:0 6px}
.sech{display:flex;align-items:center;gap:12px;margin:30px 0 12px}
.sech .si,.tool .si{width:36px;height:36px;border-radius:12px;background:var(--soft);color:var(--soft-ink);display:grid;place-items:center;flex:none}
.sech .si svg,.tool .si svg{width:19px;height:19px}
.sech h2{font-size:18px;font-weight:700;line-height:1.5;text-wrap:balance}
.sech .sub{font-size:13px;color:var(--muted);line-height:1.5}
.lhero{display:flex;align-items:center;gap:18px;padding:18px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(150deg,var(--soft),var(--surface));box-shadow:var(--sh)}
.ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p) * 1%),var(--line) 0);display:grid;place-items:center;position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;font-size:19px;font-weight:700}
.pmini{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px 16px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--sh)}
.pmini .mi{width:40px;height:40px;border-radius:14px;background:var(--soft);color:var(--soft-ink);display:grid;place-items:center;flex:none}
.pmini .mi svg{width:21px;height:21px}
.pmini .chev-l{width:18px;height:18px;color:var(--muted);flex:none}
.pres{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);background:var(--surface);padding:14px 16px;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}

    tx:"موقف الكلية الأمريكية للطب الرياضي (ACSM) للمبتدئين: حمل يسمح بـ 8 إلى 12 تكراراً، من يومين إلى ثلاثة أيام أسبوعياً، وزيادة الحمل بنسبة 2 إلى 10% عندما تقدرين على تكرار إضافي أو اثنين فوق الهدف. برنامجك أخف من هذا عمداً (جهد 5 إلى 7 من 10) لأنك طلبتِ برنامجاً خفيفاً، فالمتوقع مكاسب أصغر لكنها حقيقية لمن تبدأ. هذا الدليل يخص مبدأ التدريب بالمقاومة وتدرّجه عموماً، لا كل حركة على حدة.",

  neck:{t:"الرقبة الأمامية", lv:"mid",
    tx:"تحليلان تجميعيان لتجارب عشوائية: التمارين العلاجية حسّنت زاوية الرأس مع العمود الفقري (CVA) وخفّفت ألم الرقبة. في أحدهما (10 تجارب، 550 مشاركاً) تحسّنت الزاوية بنحو 3.4 درجات وانخفض الألم بنحو 1.4 درجة من 10، لكن ثقة الأدلة وُصفت بأنها «منخفضة إلى متوسطة». وأشار تحليل فرعي استكشافي إلى أن البرامج المركّبة (تقوية عضلات الرقبة العميقة وتثبيت اللوحين وتمدد العضلات المشدودة وتصحيح الوضعية) وتلك التي تستمر 8 أسابيع فأكثر قد تكون أفضل. التحليل الآخر (7 تجارب، 627 مشاركاً) وجد تحسناً في الزاوية أيضاً. لم أجد دراسة تقيس تمرين «سحب الذقن» وحده، فهو جزء منطقي من برنامج مركّب.",

  sh:{t:"الكتفان المدوّران", lv:"mid",
    tx:"مراجعة لتمارين تصحيح وضع اللوحين وجدت أن تمدد عضلات الصدر وحده، أو مع تقوية عضلات سحب اللوحين، غيّر وضع الكتف في الراحة، وأن التقوية وحدها لا يُنصح بالاعتماد عليها. وصف المؤلف الأدلة بأنها مشجعة لكن محدودة وقليلة الجودة. وفي تجربة عشوائية على 39 شابة (18 إلى 25 سنة) لديهن متلازمة الصليب العلوي، حسّنت تمارين تثبيت اللوح بالحبل المطاطي (3 أيام أسبوعياً لمدة 4 أسابيع) زاويتَي الرقبة والكتف وطول العضلة الصدرية الصغرى وقوة عضلات اللوح، ولم تتغير انحناءة الظهر العلوي. لهذا يجمع برنامجك التمدد والتقوية معاً.",

  rhr:{t:"نبض الراحة: المعدّل الطبيعي وطريقة القياس", lv:"strong",
    tx:"بحسب مايو كلينك: معظم البالغين نبضهم في الراحة بين 60 و100 نبضة في الدقيقة، وقد يقترب من 40 عند الرياضيين المدرَّبين جداً، والرقم الأقل غالباً يعكس لياقة أفضل. يُقاس صباحاً وأنتِ مستيقظة وهادئة وساكنة، عند المعصم تحت الإبهام أو على جانب الرقبة، بعدّ 15 ثانية والضرب في 4، أو 30 ثانية والضرب في 2. من العوامل المؤثرة فيه: العمر واللياقة والنوم والتدخين والانفعالات ووضعية الجسم والأدوية. يُنصح بمراجعة مختص إن كان فوق 100 بانتظام، أو كان غالباً تحت 60 وأنتِ لستِ رياضية مدرَّبة، ويصبح ذلك أهم مع إغماء أو دوار أو ضيق نفَس. الأجهزة القابلة للارتداء سهلة لكن قراءتها قد لا تكون دقيقة. وتشير مراجعة بوخهايت (2014) إلى أن متابعة النبض لحالة التدريب تفيد خصوصاً الرياضيين الهوائيين وتستلزم مراعاة خطأ القياس، فأستخدمه هنا مؤشراً شخصياً للاتجاه لا أداة تشخيص.",
    src:[{t:"Mayo Clinic: ما نبض الراحة الطبيعي؟", u:"https://www.mayoclinic.org/healthy-lifestyle/fitness/expert-answers/heart-rate/faq-20057979"},

  rhrex:{t:"هل ينخفض نبض الراحة بالتمرين؟", lv:"mid",

  zones:{t:"مناطق نبض التمرين عند النساء", lv:"mid",

    tx:"تحليل تجميعي لتجارب مقاومة (Morton وزملاؤه 2018) وجد أن الفائدة الإضافية من زيادة البروتين في كسب الكتلة العضلية تتوقف تقريباً عند نحو 1.6 جم لكل كجم من وزن الجسم يومياً. أُجريت الدراسات على بالغين أصحّاء يتدربون بالمقاومة، وكثير منها بمكملات بروتين، وليس على برنامج خفيف مثل هذا. لذلك تعرض الحاسبة مدىً يبدأ من 0.8 جم/كجم، وهو الحد الأدنى الشائع في التوصيات الغذائية (رقم معروف لكني لم أتحقق من نصه المباشر هنا)، وينتهي عند 1.6. وبرنامجك خفيف، فأقدّر أنك لا تحتاجين إلى سقف المدى، وهذا استنتاج مني لا من دراسة. من لديها مرض كلوي أو حمل أو رضاعة فلتسأل طبيبتها أولاً.",

}

  D.ex.forEach(function(id, i){ for(var r = 0; r < W.rounds; r++){ setsT++; if(on(K(w, d, "s", i, r))) sets++; } });

  var fin = on(K(w, d, "f", 0));
  var tot = setsT + 3 + WU[D.kind].length + CD[D.kind].length;
  var got = sets + (fin ? 3 : 0) + wu + cd;
  return {sets:sets, setsT:setsT, fin:fin, wu:wu, cd:cd, pct:Math.round(100 * got / tot)};
}

var TM = null, AC = null, WL = null;
function beep(f, ms){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
    var t = AC.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.25, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
    o.start(t); o.stop(t + ms / 1000 + 0.03);
  }catch(e){}
}
function buzz(p){ try{ if(S.sound && navigator.vibrate) navigator.vibrate(p); }catch(e){} }
function wake(on_){
  try{
    if(on_){ if(navigator.wakeLock && !WL){ navigator.wakeLock.request("screen").then(function(l){ WL = l; }).catch(function(){}); } }
    else if(WL){ WL.release().catch(function(){}); WL = null; }
  }catch(e){}
}
function tmStart(o){
  tmStop(true);
  TM = {segs:o.segs, i:0, big:!!o.big, onDone:o.onDone || null, paused:false, rem:0, last:-1, total:o.segs.reduce(function(a, s){ return a + s.sec; }, 0)};
  TM.end = Date.now() + TM.segs[0].sec * 1000;
  if(TM.big) wake(true);
  beep(700, 120); buzz(40);
  tmBuild();
}
function tmStop(silent){
  if(TM && TM.big) wake(false);
  TM = null;
  var el = $("#tm"); if(el){ el.hidden = true; el.className = "tm"; el.innerHTML = ""; }
}
function tmLeft(){ return TM.paused ? TM.rem : Math.max(0, TM.end - Date.now()); }
function tmNext(){
  if(!TM) return;
  if(TM.i + 1 >= TM.segs.length){
    var cb = TM.onDone; beep(960, 450); buzz([120, 80, 120]); tmStop(); if(cb) cb(); return;
  }
  TM.i++; TM.end = Date.now() + TM.segs[TM.i].sec * 1000; TM.paused = false; TM.last = -1;
  var k = TM.segs[TM.i].kind;

function tmBuild(){

      '<div class="mv">' + esc(s.label) + '</div>' +

function tmPaint(){
  if(!TM) return;

var DAYN = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function dkey(d){ d = d || new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function dparse(k){ var p = String(k).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function dfmt(k){ var d = dparse(k); return DAYN[d.getDay()] + " " + d.getDate() + "/" + (d.getMonth() + 1); }
function dshort(k){ var d = dparse(k); return d.getDate() + "/" + (d.getMonth() + 1); }
function chkRows(){
  return Object.keys(S.chk || {}).sort().filter(function(k){ var e = S.chk[k]; return e && typeof e.p === "number" && e.p > 0; })
    .map(function(k){ var e = S.chk[k]; return {k:k, p:e.p, s:(typeof e.s === "number" ? e.s : null), f:!!e.f}; });
}
function avg(a){ return a.length ? a.reduce(function(x, y){ return x + y; }, 0) / a.length : 0; }
function r1(x){ return Math.round(x * 10) / 10; }

/* تفسير رقم واحد. المصدر: Mayo Clinic (المدى 60 إلى 100، ومتى تُراجَع مختصة) */
function pulseBand(b){

  if(b < 60) return {lv:"info", t:"أقل من 60", tx:"شائع عند من يمارسن الرياضة الهوائية بانتظام، وقد يكون طبيعياً لدى بعض الناس.", act:"إن لم تكوني رياضية مدرَّبة وكان الرقم يتكرر هكذا، فاذكريه لطبيبتك، وخاصة مع دوار أو تعب غير معتاد أو إغماء."};
  if(b < 70) return {lv:"ok", t:"طبيعي، في الجزء المنخفض من النطاق", tx:"المعتاد للبالغين بين 60 و100. والرقم الأقل ضمن هذا النطاق يعكس غالباً لياقة أفضل.", act:"لا شيء مطلوب. تابعي القراءة أسبوعاً بعد أسبوع."};
  if(b < 85) return {lv:"ok", t:"طبيعي، في وسط النطاق", tx:"ضمن المعتاد (60 إلى 100). يتأثر الرقم بالنوم والانفعال والأدوية، فالأهم اتجاهه عبر أسابيع لا قراءة يوم واحد.", act:"لا شيء مطلوب. تابعي القراءة أسبوعاً بعد أسبوع."};
  if(b <= 100) return {lv:"ok", t:"طبيعي، في الجزء المرتفع من النطاق", tx:"ما زال ضمن 60 إلى 100. قد يرتفع قليلاً بقلة النوم أو التوتر أو الحرارة، ويميل إلى الانخفاض قليلاً مع انتظام التمرين الهوائي.", act:"لا شيء مطلوب. جربي القياس في وقت ثابت كل صباح لمقارنة أدق."};
  if(b < 120) return {lv:"info", t:"فوق 100", tx:"إن كان بعد جهد أو انفعال أو حرارة أو مرض فقد يكون مؤقتاً.", act:"أعيدي القياس بعد جلوس هادئ 5 دقائق. إن تكرر فوق 100 وأنتِ في الراحة فراجعي طبيبتك."};
  return {lv:"warn", t:"مرتفع جداً في الراحة", tx:"هذا أعلى بكثير من المعتاد في الراحة.", act:"أعيدي القياس بعد الجلوس هادئة. إن بقي مرتفعاً أو صاحبه خفقان أو ضيق نفَس أو ألم صدر أو دوار فاطلبي رعاية طبية."};
}

/* الاتجاه: متوسط آخر 7 مقابل أول 7، بعد استبعاد الأيام غير المعتادة (راجعي «كيف يقرأ الموقع اتجاه نبضك؟») */
function pulseTrend(){
  var rows = chkRows(), used = rows.filter(function(r){ return !r.f; });
  if(used.length < 3) used = rows;
  var out = {n:rows.length, used:used.length, last:rows.length ? rows[rows.length - 1] : null};
  if(!used.length) return out;
  var l7 = used.slice(-7).map(function(r){ return r.p; });
  out.avg7 = r1(avg(l7));
  var sl = used.slice(-7).filter(function(r){ return r.s != null; }).map(function(r){ return r.s; });
  if(sl.length >= 3) out.sleep7 = r1(avg(sl));
  if(used.length >= 14){
    out.first7 = r1(avg(used.slice(0, 7).map(function(r){ return r.p; })));
    out.diff = r1(out.avg7 - out.first7);
  }
  return out;
}
function trendText(t){
  if(t.diff == null) return "تحتاجين 14 قراءة على الأقل لأقارن أول أسبوع بآخر أسبوع. الآن لديك " + t.n + ".";
  var d = t.diff, a = Math.abs(d);
  if(a < 2) return "متوسطك ثابت تقريباً (فرق أقل من نبضتين). هذا متوقع: التغيّر المتوسط من برامج التمرين نحو 3 نبضات، والقوة وحدها لم تُظهر أثراً واضحاً.";
  if(d < 0) return "انخفض متوسطك نحو " + r1(a) + " نبضة منذ البداية. اتجاه يتوافق مع تحسّن اللياقة، لكن النوم والتوتر وغيرهما يحرّكان الرقم أيضاً، فلا تنسبيه للتمرين وحده.";
  return "ارتفع متوسطك نحو " + r1(a) + " نبضة منذ البداية. يحدث مع قلة النوم أو التوتر أو المرض أو الحرارة. إن استمر أسابيع مع تعب غير معتاد فاذكريه لطبيبتك.";
}
/* رسم النبض: خط واحد ونطاق الطبيعي 60 إلى 100 مظلّل، ونقاط مفرغة للأيام غير المعتادة */
function pulseChart(rows){
  rows = rows.slice(-30);
  if(rows.length < 2) return "";
  /* الزمن يسير من اليمين إلى اليسار كبقية رسوم الموقع، ومحور القيم على اليمين */
  var W = 320, H = 150, PL = 10, PR = 32, T = 12, B = 24, XR = W - PR;
  var vs = rows.map(function(r){ return r.p; }), mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
  mn = Math.min(mn, 55) - 3; mx = Math.max(mx, 75) + 3;
  if(mx - mn < 24){ var c = (mx + mn) / 2; mn = c - 12; mx = c + 12; }
  var X = function(i){ return XR - (XR - PL) * i / (rows.length - 1); };
  var Y = function(v){ return T + (H - T - B) * (1 - (v - mn) / (mx - mn)); };
  var bt = Y(Math.min(100, mx)), bb = Y(Math.max(60, mn));
  var pts = rows.map(function(r, i){ return X(i).toFixed(1) + "," + Y(r.p).toFixed(1); }).join(" ");
  var tk = [], v;
  for(v = Math.ceil(mn / 10) * 10; v <= mx; v += 10) tk.push(v);
  if(tk.length > 5) tk = tk.filter(function(x, i){ return i % 2 === 0; });
  var svg = '<svg class="pchart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="رسم لنبض الصباح في آخر ' + rows.length + ' قراءة، من ' + Math.min.apply(null, vs) + ' إلى ' + Math.max.apply(null, vs) + ' نبضة، والنطاق الطبيعي 60 إلى 100 مظلّل">';
  if(bb > bt) svg += '<rect class="band" x="' + PL + '" y="' + bt.toFixed(1) + '" width="' + (XR - PL) + '" height="' + (bb - bt).toFixed(1) + '" rx="4"/>';
  tk.forEach(function(t){ svg += '<line class="gl" x1="' + PL + '" x2="' + XR + '" y1="' + Y(t).toFixed(1) + '" y2="' + Y(t).toFixed(1) + '"/><text x="' + (W - 4) + '" y="' + (Y(t) + 3.5).toFixed(1) + '" text-anchor="end">' + t + '</text>'; });
  svg += '<polyline class="ln" points="' + pts + '"/>';
  rows.forEach(function(r, i){ svg += '<circle class="' + (r.f ? "fl" : "") + '" cx="' + X(i).toFixed(1) + '" cy="' + Y(r.p).toFixed(1) + '" r="' + (rows.length > 18 ? 3 : 4) + '"><title>' + dfmt(r.k) + ": " + r.p + (r.f ? " (يوم غير معتاد)" : "") + '</title></circle>'; });
  svg += '<text x="' + XR + '" y="' + (H - 6) + '" text-anchor="end">' + dshort(rows[0].k) + '</text><text x="' + PL + '" y="' + (H - 6) + '" text-anchor="start">' + dshort(rows[rows.length - 1].k) + '</text></svg>';
  return svg;
}

  return '<div class="info"><h2 class="h2">عدّاد النبض</h2>' +
    '<p class="sm">ضعي إصبعين (لا الإبهام) على معصمك تحت قاعدة الإبهام، أو على جانب الرقبة. عندما تحسّين النبض اضغطي الزر الكبير مع كل نبضة. يبدأ العدّ من أول ضغطة ويستمر 30 ثانية، ثم أضرب الرقم في 2.</p>' +
    '<div class="pcbox"><div class="pct num" id="pct" aria-live="off">30</div><div class="xs muted" id="pcl">ثانية متبقية</div>' +
    '<button class="pcbtn" id="pcbtn" data-act="ptap" aria-label="اضغطي مع كل نبضة"><span class="num" id="pcn">0</span><small id="pcs">اضغطي مع أول نبضة</small></button></div>' +
    '<div id="pcres"></div></div>';

function pcPaint(){
  var n = document.getElementById("pcn"); if(!n){ pcStop(); return; }
  n.textContent = PC.taps;
  var left = Math.max(0, 30 - Math.floor((Date.now() - PC.t0) / 1000));
  var t = document.getElementById("pct"); if(t) t.textContent = left;
  if(Date.now() - PC.t0 >= 30000) pcFinish();
}
function pcFinish(){
  pcStop(); PC.done = true; PC.bpm = PC.taps * 2;
  var t = document.getElementById("pct"); if(t) t.textContent = "0";
  var s = document.getElementById("pcs"); if(s) s.textContent = "انتهى العدّ";
  var b = document.getElementById("pcbtn"); if(b) b.disabled = true;
  var r = document.getElementById("pcres"); if(!r) return;
  if(PC.taps < 15){ r.innerHTML = '<div class="warn">عدد الضغطات قليل (' + PC.taps + ')، ربما فاتتك نبضات. أعيدي المحاولة.</div><button class="btn quiet full" data-act="pagain">إعادة العدّ</button>'; return; }
  r.innerHTML = bandHTML(PC.bpm) + '<div class="row" style="gap:10px;margin-top:12px"><button class="btn" style="flex:1" data-act="puse">استخدمي هذه القراءة</button><button class="btn quiet" data-act="pagain">إعادة</button></div>';
}
function pcTap(){
  if(PC.done) return;
  if(!PC.on){ PC.on = true; PC.t0 = Date.now(); PC.taps = 0; var s = document.getElementById("pcs"); if(s) s.textContent = "اضغطي مع كل نبضة"; PC.tick = setInterval(pcPaint, 250); }
  PC.taps++; pcPaint();
}

/* ============ الدمج عند تعارض جهازين ============ */
function mergeStates(L, C){
  var newer = (C.ts || 0) > (L.ts || 0) ? C : L, older = newer === C ? L : C, M = {}, k;
  for(k in older) M[k] = older[k];
  for(k in newer) M[k] = newer[k];
  var un = function(a, b){ return Object.assign({}, a || {}, b || {}); };
  M.done = un(older.done, newer.done);
  ["alt", "gear", "pos", "walks"].forEach(function(f){ M[f] = un(older[f], newer[f]); });
  M.log = {};
  var ids = {}; Object.keys(older.log || {}).concat(Object.keys(newer.log || {})).forEach(function(i){ ids[i] = 1; });
  Object.keys(ids).forEach(function(id){
    var map = {};
    ((older.log || {})[id] || []).concat(((newer.log || {})[id] || [])).forEach(function(e){
      var key = e.w + "." + e.d; if(!map[key] || (e.ts || 0) >= (map[key].ts || 0)) map[key] = e;
    });
    M.log[id] = Object.keys(map).map(function(q){ return map[q]; });
  });
  M.chk = {};
  var dk = {}; Object.keys(older.chk || {}).concat(Object.keys(newer.chk || {})).forEach(function(d){ dk[d] = 1; });
  Object.keys(dk).forEach(function(d){
    var a = (older.chk || {})[d], b = (newer.chk || {})[d];
    M.chk[d] = !a ? b : (!b ? a : ((b.u || 0) >= (a.u || 0) ? b : a));
  });
  M.body = {};
  var wk = {}; Object.keys(older.body || {}).concat(Object.keys(newer.body || {})).forEach(function(w){ wk[w] = 1; });
  Object.keys(wk).forEach(function(w){
    var a = (older.body || {})[w] || {wall:[0, 0, 0], pulse:"", note:""}, b = (newer.body || {})[w] || {wall:[0, 0, 0], pulse:"", note:""};
    M.body[w] = {pulse:(b.pulse !== "" && b.pulse != null ? b.pulse : (a.pulse || "")),
      wall:[0, 1, 2].map(function(i){ return (a.wall && a.wall[i]) || (b.wall && b.wall[i]) ? 1 : 0; }),
      note:((b.note || "").length >= (a.note || "").length ? b.note : a.note) || ""};
  });
  return M;
}

/* ============ الحفظ السحابي (اختياري، يتحسّن به الحفظ المحلي ولا يستبدله) ============ */
var CL = {st:"local", na:false, at:0, uid:null, ref:null, timer:null, busy:false, again:false, retry:null, lastPull:0};
function hasProgress(o){
  o = o || S;
  return !!(Object.keys(o.done || {}).length || Object.keys(o.log || {}).length || Object.keys(o.chk || {}).length ||
    Object.keys(o.body || {}).some(function(w){ var b = o.body[w]; return b && ((b.pulse !== "" && b.pulse != null) || (b.wall || []).some(function(x){ return x; }) || b.note); }));
}
function cloudJson(){
  var c = {}; Object.keys(S).forEach(function(k){ if(k !== "synced" && k !== "qi" && k !== "qbag" && k !== "qh") c[k] = S[k]; });
  return JSON.stringify(c);
}
function syncLabel(){
  if(CL.st === "ok") return "محفوظ في حسابك وعلى هذا الجهاز";
  if(CL.st === "wait") return "جارٍ الحفظ…";
  if(CL.st === "err") return "تعذّر الحفظ السحابي الآن، وتقدمك محفوظ على هذا الجهاز";
  if(CL.st === "ro") return "الحفظ السحابي يحتاج صلاحية «مشارِك». تقدمك محفوظ على هذا الجهاز فقط";
  return "محفوظ على هذا الجهاز";
}
function syncHTML(){ return '<span class="sync ' + CL.st + '" data-sync>' + syncLabel() + '</span>'; }
function paintSync(){
  var els = document.querySelectorAll("[data-sync]");
  for(var i = 0; i < els.length; i++){ els[i].className = "sync " + CL.st; els[i].textContent = syncLabel(); }
}
function cloudQueue(now){
  if(!CL.ref) return;
  CL.st = "wait"; paintSync();
  clearTimeout(CL.timer); CL.timer = setTimeout(cloudPush, now ? 0 : 1800);
}
function cloudPush(){
  if(!CL.ref) return;
  if(CL.busy){ CL.again = true; return; }
  CL.busy = true; clearTimeout(CL.retry);
  if(!S.ts) S.ts = Date.now();
  var ts = S.ts, json = cloudJson();
  CL.ref.set({v:1, ts:ts, json:json}).then(function(){
    CL.busy = false; CL.st = "ok"; CL.at = Date.now();
    if(S.synced !== ts){ S.synced = ts; lsWrite(); }
    paintSync();
    if(CL.again){ CL.again = false; if(S.ts !== ts) cloudPush(); }
  }, function(e){
    CL.busy = false; CL.again = false;
    CL.st = (e && e.code === "invalid_argument") ? "ro" : "err";
    paintSync();
    if(CL.st === "err") CL.retry = setTimeout(function(){ cloudQueue(true); }, 20000);
  });
}
function adoptState(o){
  var q = {qi:S.qi, qbag:S.qbag};
  try{ localStorage.setItem(STORE_KEY + "-prev", JSON.stringify(S)); }catch(e){}
  S = freshState();
  Object.keys(o).forEach(function(k){ S[k] = o[k]; });
  S.qi = q.qi; S.qbag = q.qbag;
  normState(); SYNCH = stateHash(); lsWrite();
  var ae = document.activeElement;
  if(!(typeof TM !== "undefined" && TM) && !(ae && /INPUT|TEXTAREA/.test(ae.tagName)) && $("#shade").hidden) render();
  else paintSync();
}
function cloudMerge(snap){
  CL.lastPull = Date.now();
  var cloud = null;
  if(snap && snap.exists){
    try{ var d = snap.data(); cloud = migrateOrd(JSON.parse(d.json)); cloud.ts = d.ts || cloud.ts || 0; }catch(e){ cloud = null; }
  }
  if(!cloud){
    if(hasProgress()){ if(!S.ts){ S.ts = Date.now(); lsWrite(); } cloudQueue(true); }
    else { CL.st = "ok"; CL.at = Date.now(); paintSync(); }
    return;
  }
  var lts = S.ts || 0, cts = cloud.ts || 0, sy = S.synced || 0;
  if(stateHash(cloud) === SYNCH){ S.synced = Math.max(lts, cts); S.ts = S.synced; lsWrite(); CL.st = "ok"; CL.at = Date.now(); paintSync(); return; }
  if(!hasProgress()){ adoptState(cloud); S.synced = cts; lsWrite(); CL.st = "ok"; CL.at = Date.now(); paintSync(); return; }
  if(sy > 0 && lts <= sy && cts > sy){ adoptState(cloud); S.synced = cts; lsWrite(); CL.st = "ok"; CL.at = Date.now(); paintSync(); return; }
  if(sy > 0 && cts <= sy && lts > sy){ cloudQueue(true); return; }
  /* تغيّر الطرفان: ندمج دون خسارة أي شيء */
  var m = mergeStates(S, cloud);
  adoptState(m);
  S.ts = Date.now(); SYNCH = stateHash(); lsWrite();
  cloudQueue(true);
}
function cloudPull(){
  if(!CL.ref || CL.busy) return;
  CL.ref.get().then(cloudMerge, function(){});
}
function cloudInit(){
  var c = null;
  try{ c = window.claude; }catch(e){}
  if(!c || typeof c.use !== "function"){ CL.na = true; return; }
  CL.st = "wait"; paintSync();
  Promise.all([c.use("db"), c.use("user")]).then(function(r){
    var db = r[0], user = r[1];
    if(!db || !user || typeof user.id !== "function"){ CL.st = "local"; paintSync(); return null; }
    return user.id().then(function(id){
      if(!id){ CL.st = "local"; paintSync(); return null; }
      CL.uid = id; CL.ref = db.doc("data/users/" + id + "/progress");
      return CL.ref.get().then(cloudMerge);
    });
  }).catch(function(e){ CL.st = (CL.ref ? "err" : "local"); paintSync(); });
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden"){ if(CL.timer && CL.ref && !CL.busy){ clearTimeout(CL.timer); cloudPush(); } }
    else if(CL.ref && Date.now() - CL.lastPull > 60000){ cloudPull(); }
  });
}

var DAYORD = ["الأول", "الثاني", "الثالث", "الرابع"];
function dayLabel(d){ return "اليوم " + DAYORD[d - 1]; }
function kindName(D){ return D.kind === "up" ? "الجزء العلوي" : "الجزء السفلي"; }
function olist(a){ return '<ol>' + a.map(function(s){ return '<li>' + s + '</li>'; }).join("") + '</ol>'; }

function dotsHTML(w){
  var h = "";
  for(var d = 1; d <= 4; d++){ h += '<i class="' + (dayDone(w, d) ? "on" : "") + '"></i>'; }
  return '<div class="dots" role="img" aria-label="' + sessionsDone(w) + ' من 4 جلسات مكتملة">' + h + '</div>';

/* أزرار الفيديو: بحث يوتيوب بالعربي وبالإنجليزي موجّه للنساء، وفيديو مباشر إن وُجد */
function vbar(o){
  var qa = o.qa || (o.ar + (o.en ? " " + o.en : "") + " للنساء");
  var qe = o.qe || ((o.en || o.ar) + " for women");
  var h = '<div class="vbar">';
  if(o.vid) h += '<a class="vbtn hi" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=' + o.vid + '">' + ico("play") + 'فيديو موجّه للنساء</a>';
  h += '<a class="vbtn" target="_blank" rel="noopener" href="' + yt(qa) + '">' + ico("play") + 'بحث بالعربي</a>' +
    '<a class="vbtn" target="_blank" rel="noopener" href="' + yt(qe) + '">' + ico("play") + 'بحث بالإنجليزي</a></div>';
  return h;
}
function enLine(en){ return en ? '<span class="en">' + esc(en) + '</span>' : ''; }
function setTarget(x, W, useAlt){
  var t = x.t, fx = x.fix;
  if(useAlt && x.alt){ if(x.alt.t) t = x.alt.t; if(x.alt.fix) fx = x.alt.fix; }
  if(t === "hold") return W.hold + " ثانية ثبات";
  if(t === "fixed") return fx;
  if(t === "alt") return W.reps + " تكراراً بالتبادل (المجموع)";
  if(t === "split") return W.reps + " تكراراً (المجموع)، نصفها لكل ساق";
  if(t === "arm") return W.reps + " تكراراً لكل ذراع";
  return W.reps + " تكراراً";
}
/* عند تفعيل البديل لا نعرض نصائح الحركة الأساسية (قد تذكر الحبل أو حركة مختلفة) */
function cueOf(x, useAlt){
  if(!useAlt || !x.alt) return x.cue;
  return x.alt.steps ? (x.alt.cue || "") : "";
}
/* بطاقة البديل: اسمه وشرح قصير وفيديو عربي وإنجليزي وزر التفعيل */
function altBlock(id){
  var x = EX[id]; if(!x.alt) return "";
  var a = x.alt, useAlt = !!S.alt[id];

  return h;
}

  var nDone = 0; for(var r0 = 0; r0 < W.rounds; r0++){ if(on(K(w, d, "s", i, r0))) nDone++; }

  var nm = useAlt ? x.alt.ar : x.ar, en = useAlt ? x.alt.en : x.en;
