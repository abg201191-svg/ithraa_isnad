  h += '</div></div>';
  if(open){
    h += '<div class="exb">';
    var chips = "";
    if(x.area) chips += '<span class="chip">استقامة · ' + AREAS[x.area] + '</span>';
    if(x.band) chips += '<span class="chip">' + (useAlt ? "بديل بدون حبل" : "حبل اختياري") + '</span>';
    if(x.evk) chips += '<button class="chip ev-' + EVID[x.evk].lv + '" data-act="ev" data-k="' + x.evk + '">الدليل: ' + LVS[EVID[x.evk].lv] + '</button>';
    if(chips) h += '<div class="chips">' + chips + '</div>';
    if(cueOf(x, useAlt)) h += '<div class="cue">' + cueOf(x, useAlt) + '</div>';
    if(x.t === "hold") h += '<button class="btn quiet full" data-act="hold" data-id="' + id + '">' + ico("play") + 'عدّاد ' + W.hold + ' ثانية</button>';
    if(!x.nokg){
      h += '<div class="kgbox"><div class="kgb"><button data-act="kg" data-id="' + id + '" data-w="' + w + '" data-d="' + d + '" data-s="-0.5" aria-label="أنقصي الوزن">−</button>' +
        '<input type="number" inputmode="decimal" step="0.5" min="0" max="60" id="kg-' + id + '" data-act="kgset" data-id="' + id + '" data-w="' + w + '" data-d="' + d + '" value="' + (kgv == null ? "" : fmtKg(kgv)) + '" placeholder="0" aria-label="الوزن بالكيلوغرام">' +
        '<button data-act="kg" data-id="' + id + '" data-w="' + w + '" data-d="' + d + '" data-s="0.5" aria-label="زيدي الوزن">+</button></div><div class="xs muted">كجم</div></div>';
      h += hintHTML(id, w, d);
    }
    h += '<div><div class="lbl2">' + (useAlt ? "فيديو الحركة الأساسية" : "فيديو شرح الحركة") + '</div>' + vbar(x) + '</div>';
    h += altBlock(id);
    h += '<details class="how"><summary>' + (useAlt ? "خطوات الحركة الأساسية وأخطاؤها" : "الخطوات وأخطاء شائعة") + ico("chev") + '</summary><div class="in"><div><h4>الخطوات</h4>' + olist(x.steps) + '</div><div><h4>أخطاء شائعة</h4>' + ulist(x.bad) + '</div></div></details>';
    if(!x.nokg){
      h += '<div><div class="lbl2">كيف كان الوزن اليوم؟</div><div class="feel">' +
        [["easy", "سهل"], ["ok", "مناسب"], ["hard", "صعب"]].map(function(f){ return '<button class="' + (e && e.feel === f[0] ? "on" : "") + '" data-act="feel" data-id="' + id + '" data-w="' + w + '" data-d="' + d + '" data-v="' + f[0] + '" aria-pressed="' + !!(e && e.feel === f[0]) + '">' + f[1] + '</button>'; }).join("") + '</div></div>';
    }
    h += '</div>';
  }
  return h + '</div>';
}

function finCard(w, d){
  var W = wkd(w), D = DAYS[d - 1], moves = FIN[D.kind].slice(0, W.fin), dn = on(K(w, d, "f", 0));
  return '<section class="card col"><div class="row sp"><div class="h3">' + W.fin + ' حركات، مرتان لكل حركة</div>' + (dn ? '<span class="tag">تمّ</span>' : '') + '</div>' +
    '<p class="rule">30 ثانية عمل ثم 30 ثانية راحة، بلا قفز. الجهد: <b>' + W.fe + '</b>. توقفي فوراً إن شعرتِ بدوار أو ألم في الصدر.</p>' +
    '<div class="moves">' + moves.map(function(id){ var m = FINMV[id]; return '<div><b>' + m.ar + '</b>' + enLine(m.en) + '<div class="c">' + m.cue + '</div>' + vbar(m) + '</div>'; }).join("") + '</div>' +
    '<details class="how"><summary>كيف أعرف الجهد؟' + ico("chev") + '</summary><div class="in"><p class="sm">اختبار الكلام: في الجهد المتوسط تتكلمين لكن لا تغنين، وفي الجهد العالي تقولين كلمات قليلة بين النفَسين.</p></div></details>' +
    '<div class="row wrap"><button class="btn grow" data-act="finstart" data-w="' + w + '" data-d="' + d + '">' + ico("play") + 'ابدئي المؤقّت</button><button class="btn quiet" data-act="finmark">' + (dn ? "إلغاء التأشير" : "تمّ يدوياً") + '</button></div>' +
    '<div class="chips"><button class="chip ev-logic" data-act="ev" data-k="lowimp">الدليل: ' + LVS.logic + '</button></div></section>';
}

/* أقسام الجلسة بالترتيب: الإحماء ثم التمارين ثم الحرق ثم التهدئة */
function stageList(w, d){
  var D = DAYS[d - 1], st = dayStats(w, d), cm = totalMin(w, d) - 10 - finMin(w);
  return [
    {n:1, ic:"sun", name:"الإحماء", min:5, got:st.wu, tot:WU[D.kind].length, meta:st.wu + "/" + WU[D.kind].length + " حركات"},
    {n:2, ic:"dumb", name:"التمارين", min:cm, got:st.sets, tot:st.setsT, meta:st.sets + "/" + st.setsT + " جولة"},
    {n:3, ic:"heart", name:"الحرق بلا قفز", min:finMin(w), got:st.fin ? 1 : 0, tot:1, meta:st.fin ? "تمّ" : wkd(w).fin + " حركات للقلب"},
    {n:4, ic:"leaf", name:"التهدئة والاستقامة", min:5, got:st.cd, tot:CD[D.kind].length, meta:st.cd + "/" + CD[D.kind].length + " حركات"}
  ];
}
function firstOpenStage(w, d){
  var L = stageList(w, d);
  if(L[1].got === 0 && !L[2].got && L[0].got < L[0].tot) return 1;
  if(L[1].got < L[1].tot) return 2;
  if(!L[2].got) return 3;
  return 4;
}
function stageNext(w, d, n, label){
  return '<button class="btn full" data-act="stagego" data-w="' + w + '" data-d="' + d + '" data-n="' + n + '">' + label + '</button>';
}
function stageBody(w, d, n){
  var W = wkd(w), D = DAYS[d - 1];
  if(n === 1){
    return '<p class="rule">5 دقائق خفيفة ترفع حرارة الجسم وتحرّك الكتفين والورك قبل الحمل.</p><div class="group">' +
      WU[D.kind].map(function(x, j){ return chkRow(w, d, "w", j, x); }).join("") + '</div>' +
      '<p class="sm muted">علّمي كل حركة بعد أن تنهيها، أو اضغطي التشغيل ليعدّ لك الوقت. التأشير اختياري.</p>' +
      stageNext(w, d, 2, "التالي: التمارين");
  }
  if(n === 2){
    return '<p class="rule">انتقلي بين الحركات بالترتيب (15 ثانية انتقال)، وبعد الحركة السادسة ارتاحي 40 ثانية ثم ابدئي جولة جديدة من الحركة 1. الجهد <b>' + W.rpe + '</b>. اضغطي دائرة الجولة بعد كل جولة ويبدأ مؤقت الانتقال.</p>' +
      '<div class="col">' + D.ex.map(function(id, i){ return exCard(w, d, i, id); }).join("") + '</div>' +
      stageNext(w, d, 3, "التالي: الحرق بلا قفز");
  }
  if(n === 3){
    return finCard(w, d) + stageNext(w, d, 4, "التالي: التهدئة والاستقامة");
  }
  var nd = d < 4 ? d + 1 : 0;
  return '<p class="rule">تمدد وحركات هادئة تُرجع النبض وتدعم الاستقامة. التأشير اختياري.</p><div class="group">' +
    CD[D.kind].map(function(x, j){ return chkRow(w, d, "c", j, x); }).join("") + '</div>' +
    '<div class="h3" style="margin-top:6px">الختام</div><div class="col">' + stepEnd(w, d).replace(/<h1 class="st-title">/, '<h2 class="h2">').replace('</h1>', '</h2>') +
    (nd ? '<button class="btn full" data-act="day" data-w="' + w + '" data-d="' + nd + '">' + dayLabel(nd) + ': ' + DAYS[nd - 1].title + '</button>'
        : '<button class="btn full" data-act="go" data-v="home">العودة إلى الجدول</button>') + '</div>';
}

function renderDay(w, d){
  var W = wkd(w), D = DAYS[d - 1], st = dayStats(w, d), h = "";
  h += '<div class="stop"><div class="r"><button class="icobtn" data-act="go" data-v="home" aria-label="الرجوع إلى الجدول">' + ico("back") + '</button>' +
    '<div class="ttl">الأسبوع ' + w + ' · ' + dayLabel(d) + '</div><span style="width:44px"></span></div></div>';
  h += '<header class="dhead"><div class="dk">' + W.name + '</div><h1 class="dt">' + D.title + '</h1>' +
    '<p class="dfocus">' + D.focus + '</p>' +
    '<div class="dmeta"><span class="dm">' + ico("clock") + 'نحو ' + totalMin(w, d) + ' دقيقة</span><span class="dm">' + kindName(D) + '</span><span class="dm">' + D.ex.length + ' حركات · ' + jol(W.rounds) + '</span></div>' +
    '<div class="dprog"><div class="bar"><i style="width:' + st.pct + '%"></i></div><div class="dpl"><span>أنجزتِ</span><b class="num">' + st.pct + '%</b><span>من هذه الجلسة</span></div></div></header>';

  var cur = UI.stg[posKey(w, d)] || 0;
  h += '<div class="tl" role="list">' + stageList(w, d).map(function(sg){
    var open = cur === sg.n, dn = sg.got >= sg.tot;
    return '<section class="stg' + (open ? " open" : "") + (dn ? " dn" : "") + '" id="stg-' + sg.n + '" role="listitem">' +
      '<button class="stgh" data-act="stage" data-w="' + w + '" data-d="' + d + '" data-n="' + sg.n + '" aria-expanded="' + open + '">' +
      '<span class="stgn" style="--p:' + Math.round(100 * Math.min(1, sg.got / sg.tot)) + '">' + ico(dn ? "check" : sg.ic) + '</span>' +
      '<span class="grow"><span class="stgk">الخطوة ' + sg.n + ' من 4</span><span class="stgt">' + sg.name + '</span><span class="stgm"><span>' + ico("clock") + 'نحو ' + sg.min + ' د</span><span>' + sg.meta + '</span></span></span>' + ico("chev", "chv") + '</button>' +
      (open ? '<div class="stgb">' + stageBody(w, d, sg.n) + '</div>' : '') + '</section>';
  }).join("") + '</div>';
  return h;
}

/* ============ وضع الجلسة خطوة بخطوة ============ */
function stepWarm(w, d){
  var W = wkd(w), D = DAYS[d - 1];
  return '<div class="where">البداية · 5 دقائق</div><h1 class="st-title">إحماء قصير</h1>' +
    '<p class="rule">جلسة اليوم نحو <b>' + totalMin(w, d) + ' دقيقة</b>: هذا الإحماء، ثم <b>6 حركات × ' + jol(W.rounds) + '</b> بالترتيب، ثم <b>حرق ' + finMin(w) + ' دقائق</b>، ثم تهدئة 5 دقائق. بين الحركات 15 ثانية انتقال، وبين الجولات 40 ثانية راحة. الجهد <b>' + W.rpe + '</b>.</p>' +
    '<div class="group">' + WU[D.kind].map(function(x, j){ return chkRow(w, d, "w", j, x); }).join("") + '</div>' +
    '<p class="sm muted">علّمي كل حركة بعد أن تنهيها، أو اضغطي التشغيل ليعدّ لك الوقت. التأشير اختياري ولا يمنع إكمال الجلسة.</p>';
}

function stepSet(w, d, s, steps, p){
  var W = wkd(w), D = DAYS[d - 1], id = D.ex[s.i], x = EX[id], useAlt = !!S.alt[id] && !!x.alt, h = "";
  var e = entryOf(id, w, d), le = lastEntry(id, w, d), kgv = e && typeof e.kg === "number" ? e.kg : (le ? le.kg : null);
  var dn = on(K(w, d, "s", s.i, s.r)), nx = steps[p + 1];

  h += '<div class="where">الحركة ' + (s.i + 1) + ' من ' + D.ex.length + ' · الجولة ' + (s.r + 1) + ' من ' + W.rounds + '</div>';
  h += '<div><h1 class="st-title">' + (useAlt ? x.alt.ar : x.ar) + '</h1>' + enLine(useAlt ? x.alt.en : x.en) + '</div>';
  h += '<div class="st-target">' + setTarget(x, W, useAlt) + '</div>';

  var chips = "";
  if(x.area) chips += '<span class="chip">استقامة · ' + AREAS[x.area] + '</span>';
  if(x.band) chips += '<span class="chip">' + (useAlt ? "بديل بدون حبل" : "حبل اختياري") + '</span>';
  if(useAlt && !x.band) chips += '<span class="chip">البديل الأخف</span>';
  if(x.evk) chips += '<button class="chip ev-' + EVID[x.evk].lv + '" data-act="ev" data-k="' + x.evk + '">الدليل: ' + LVS[EVID[x.evk].lv] + '</button>';
  if(chips) h += '<div class="chips">' + chips + '</div>';

  if(!x.nokg){
    h += '<div class="kgbox"><div class="kgb"><button data-act="kg" data-id="' + id + '" data-w="' + w + '" data-d="' + d + '" data-s="-0.5" aria-label="أنقصي الوزن">−</button>' +
      '<input type="number" inputmode="decimal" step="0.5" min="0" max="60" id="kg-' + id + '" data-act="kgset" data-id="' + id + '" data-w="' + w + '" data-d="' + d + '" value="' + (kgv == null ? "" : fmtKg(kgv)) + '" placeholder="0" aria-label="الوزن بالكيلوغرام">' +
      '<button data-act="kg" data-id="' + id + '" data-w="' + w + '" data-d="' + d + '" data-s="0.5" aria-label="زيدي الوزن">+</button></div><div class="xs muted">كجم</div></div>';
    h += hintHTML(id, w, d);
  }
  if(x.t === "hold"){
    h += '<button class="btn quiet full" data-act="hold" data-id="' + id + '">' + ico("play") + 'عدّاد ' + W.hold + ' ثانية</button>';
  }
  if(cueOf(x, useAlt)) h += '<div class="cue">' + cueOf(x, useAlt) + '</div>';
  if(x.alt){
    h += '<button class="btn quiet full" data-act="alt" data-id="' + id + '">' + (useAlt ? "الرجوع للتمرين الأساسي" : (x.band ? "ما عندي حبل: استخدمي البديل" : "صعب عليّ: استخدمي البديل الأخف")) + '</button>';
  }

  var how = '<div><h4>فيديو شرح الحركة</h4>' + vbar(useAlt ? x.alt : x) + '</div>' +
    '<div><h4>الخطوات' + (useAlt ? ' (للحركة الأساسية)' : '') + '</h4>' + olist(x.steps) + '</div>' +
    '<div><h4>أخطاء شائعة</h4>' + ulist(x.bad) + '</div>' + altBlock(id);
  h += '<details class="how"><summary>كيف أؤديها؟ والبديل' + ico("chev") + '</summary><div class="in">' + how + '</div></details>';

  if(!x.nokg && s.r === W.rounds - 1){
    h += '<div><div class="b" style="margin-bottom:8px">كيف كان الوزن اليوم؟</div><div class="feel">' +
      [["easy", "سهل"], ["ok", "مناسب"], ["hard", "صعب"]].map(function(f){ return '<button class="' + (e && e.feel === f[0] ? "on" : "") + '" data-act="feel" data-id="' + id + '" data-w="' + w + '" data-d="' + d + '" data-v="' + f[0] + '" aria-pressed="' + !!(e && e.feel === f[0]) + '">' + f[1] + '</button>'; }).join("") + '</div></div>';
  }
  if(dn) h += '<button class="link" data-act="setundo" style="align-self:flex-start">إلغاء تأشير هذه الجولة</button>';
  if(nx){
    var rest = (nx.t === "set" && nx.r !== s.r) ? "راحة 40 ثانية ثم " : "";
    h += '<div class="next-up">بعدها: <b>' + rest + stepName(w, d, nx) + (nx.t === "set" && nx.r !== s.r ? " (الجولة " + (nx.r + 1) + ")" : "") + '</b></div>';
  }
  return h;
}

function stepFin(w, d){
  var W = wkd(w), D = DAYS[d - 1], moves = FIN[D.kind].slice(0, W.fin), dn = on(K(w, d, "f", 0));
  var h = '<div class="where">الحرق · ' + finMin(w) + ' دقائق</div><h1 class="st-title">حرق بلا قفز</h1>' +
    '<div class="st-target">' + W.fin + ' حركات، مرتان لكل حركة</div>' +
    '<p class="rule">30 ثانية عمل ثم 30 ثانية راحة، بلا قفز. الجهد: <b>' + W.fe + '</b>. توقفي فوراً إن شعرتِ بدوار أو ألم في الصدر.</p>' +
    '<details class="how"><summary>كيف أعرف الجهد؟' + ico("chev") + '</summary><div class="in"><p class="sm">اختبار الكلام: في الجهد المتوسط تتكلمين لكن لا تغنين، وفي الجهد العالي تقولين كلمات قليلة بين النفَسين.</p></div></details>' +
    '<div class="moves">' + moves.map(function(id){ var m = FINMV[id]; return '<div><b>' + m.ar + '</b>' + enLine(m.en) + '<div class="c">' + m.cue + '</div>' + vbar(m) + '</div>'; }).join("") + '</div>' +
    '<div class="chips"><button class="chip ev-logic" data-act="ev" data-k="lowimp">الدليل: ' + LVS.logic + '</button></div>';
  if(dn){
    h += '<div class="warn">تمّ الحرق، أحسنتِ.</div><button class="link" data-act="finmark" style="align-self:flex-start">إلغاء التأشير</button>';
  }else{
    h += '<div class="row wrap"><button class="link" data-act="finmark">أنهيته دون المؤقّت</button><button class="link" data-act="finskip">تخطي الحرق</button></div>';
  }
  return h;
}

function stepCool(w, d){
  var D = DAYS[d - 1];
  return '<div class="where">النهاية · 5 دقائق</div><h1 class="st-title">تهدئة واستقامة</h1>' +
    '<p class="muted">تمدد وسحب للذقن ' + (D.kind === "up" ? "يفتح الصدر ويعدّل الرقبة والكتفين" : "يفتح الورك ويريح الأرجل") + '. اضغطي الأيقونة (i) لخطوات كل حركة وفيديوها.</p>' +
    '<div class="group">' + CD[D.kind].map(function(x, j){ return chkRow(w, d, "c", j, x); }).join("") + '</div>';
}

function stepEnd(w, d){
  var st = dayStats(w, d), dn = dayDone(w, d), prs = dayPRs(w, d), p = partnerOf(d), sh = sharedIds(d);
  var h = '<div class="where">' + (dn ? "اكتملت الجلسة" : "الجلسة لم تكتمل بعد") + '</div>' +
    '<h1 class="st-title">' + (dn ? "أحسنتِ، أنهيتِ جلسة اليوم" : "ما تبقى من جلسة اليوم") + '</h1>' +
    '<p class="muted">' + (dn ? "ارتاحي وتناولي الماء. الجلسة القادمة جاهزة بأوزانك المحفوظة." : "أكملي الحركات والحرق لتُحتسب الجلسة. الإحماء والتهدئة يحسّنان الاستقامة لكنهما لا يمنعان الإكمال.") + '</p>' +
    '<div class="sumrow"><div><div class="v num">' + st.sets + '/' + st.setsT + '</div><div class="l">جولات</div></div>' +
    '<div><div class="v num">' + (st.fin ? finMin(w) : 0) + '</div><div class="l">دقائق حرق</div></div>' +
    '<div><div class="v num">' + prs + '</div><div class="l">أوزان جديدة</div></div></div>';
  if(sh.length && p){
    var names = sh.map(function(id){ return EX[id].ar; }).join(" و");
    h += '<div class="card"><div class="b">رابط بين الأيام</div><p class="sm muted" style="margin-top:4px">' +
      (p.n > d ? 'تتكرر في ' + dayLabel(p.n) + ' هذه الحركات: ' + names + '. وزن اليوم يظهر لك هناك ويُعبَّأ تلقائياً.' : 'هذه الحركات جاءت من ' + dayLabel(p.n) + ': ' + names + '. وزنها انتقل إلى هنا تلقائياً.') + '</p></div>';
  }
  return h;
}

function sessionBar(w, d, s, p, n){
  var done = stepDone(w, d, s), nd = d < 4 ? d + 1 : 0, q = "", pr = "";
  if(p > 0 && s.t !== "end") q = '<button class="btn quiet" data-act="prev">السابق</button>';
  if(s.t === "end") q = '<button class="btn quiet" data-act="closeses">قائمة اليوم</button>';
  if(s.t === "warm") pr = '<button class="btn" data-act="next">ابدئي الحركات</button>';
  else if(s.t === "set") pr = done ? '<button class="btn" data-act="next">التالي</button>' : '<button class="btn" data-act="setdone">' + ico("check") + 'تمّت الجولة</button>';
  else if(s.t === "fin") pr = done ? '<button class="btn" data-act="next">التالي</button>' : '<button class="btn" data-act="finstart" data-w="' + w + '" data-d="' + d + '">' + ico("play") + 'ابدئي المؤقّت</button>';
  else if(s.t === "cool") pr = '<button class="btn" data-act="next">إنهاء الجلسة</button>';
  else if(!dayDone(w, d)) pr = '<button class="btn" data-act="overview">عرض الخطوات</button>';
  else if(nd) pr = '<button class="btn" data-act="day" data-w="' + w + '" data-d="' + nd + '">' + dayLabel(nd) + ': ' + DAYS[nd - 1].title + '</button>';
  else if(sessionsDone(w) === 4 && w < TOTAL_WEEKS) pr = '<button class="btn" data-act="nextwk">الانتقال للأسبوع ' + (w + 1) + '</button>';
  else pr = '<button class="btn" data-act="go" data-v="home">العودة للجدول</button>';
  return '<div class="sact"><div class="sacti">' + q + pr + '</div></div>';
}

function renderPlay(w, d){
  var steps = stepsOf(w, d), n = steps.length, p = curPos(w, d), s = steps[p], h = "";
  h += '<div class="stop"><div class="r"><button class="icobtn" data-act="closeses" aria-label="الخروج إلى قائمة اليوم">' + ico("x") + '</button>' +
    '<div class="ttl">' + dayLabel(d) + ' · الخطوة ' + (p + 1) + ' من ' + n + '</div>' +
    '<button class="icobtn" data-act="overview" aria-label="كل خطوات الجلسة">' + ico("list") + '</button></div>' +
    '<div class="sprog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(100 * p / (n - 1)) + '"><i style="width:' + Math.round(100 * p / (n - 1)) + '%"></i></div></div>';
  h += '<div class="sbody">';
  if(s.t === "warm") h += stepWarm(w, d);
  else if(s.t === "set") h += stepSet(w, d, s, steps, p);
  else if(s.t === "fin") h += stepFin(w, d);
  else if(s.t === "cool") h += stepCool(w, d);
  else h += stepEnd(w, d);
  h += '</div>' + sessionBar(w, d, s, p, n);
  return h;
}

function overviewHTML(w, d){
  var steps = stepsOf(w, d), p = curPos(w, d), W = wkd(w), lastR = -1, h = '<div class="h2">خطوات الجلسة</div><div class="steps-l">';
  steps.forEach(function(s, q){
    if(s.t === "set" && s.r !== lastR){ lastR = s.r; h += '<div class="rd">الجولة ' + (s.r + 1) + ' من ' + W.rounds + '</div>'; }
    var dn = stepDone(w, d, s) && s.t !== "end";
    h += '<button data-act="stepto" data-i="' + q + '"' + (q === p ? ' aria-current="step"' : '') + '><span class="stat' + (dn ? " on" : "") + '">' + ico("check") + '</span><span class="grow' + (q === p ? " b" : "") + '">' + stepName(w, d, s) + '</span>' + (q === p ? '<span class="xs muted">أنتِ هنا</span>' : '') + '</button>';
  });
  return h + '</div>';
}

/* ============ مكوّنات مشتركة ============ */
function evBlock(k){
  var e = EVID[k];
  return '<div class="ev"><div class="row sp wrap"><span class="b">' + e.t + '</span><span class="chip ev-' + e.lv + '">' + LV[e.lv] + '</span></div><p>' + e.tx + '</p>' +
    (e.src.length ? '<div class="links">' + e.src.map(function(s){ return '<a class="lk" target="_blank" rel="noopener" href="' + s.u + '">' + s.t + '</a>'; }).join("") + '</div>' : '') + '</div>';
}
function acc(t, body, open){
  return '<details class="acc"' + (open ? " open" : "") + '><summary>' + t + ico("chev") + '</summary><div class="in">' + body + '</div></details>';
}
function accEv(k){
  var e = EVID[k], n = e.src.length;
  return '<details class="acc eva lv-' + e.lv + '"><summary><span class="evx"><span class="evt">' + e.t + '</span><span class="evm"><span class="chip ev-' + e.lv + '">' + LV[e.lv] + '</span>' + (n ? '<span class="xs muted">' + (n === 1 ? "مصدر واحد" : n === 2 ? "مصدران" : n + " مصادر") + '</span>' : '<span class="xs muted">بلا مصدر مباشر</span>') + '</span></span>' + ico("chev") + '</summary><div class="in"><p>' + e.tx + '</p>' +
    (n ? '<div class="links">' + e.src.map(function(s){ return '<a class="lk" target="_blank" rel="noopener" href="' + s.u + '">' + s.t + '</a>'; }).join("") + '</div>' : '<p class="xs muted">لا توجد مصادر مباشرة لهذه الفقرة، وهذا مذكور في القوة أعلاه.</p>') + '</div></details>';
}
function evChip(k, pre){
  var e = EVID[k];
  return '<button class="chip ev-' + e.lv + '" data-act="ev" data-k="' + k + '">' + (pre || "الدليل: ") + LV[e.lv] + '</button>';
}
function sech(icon, title, sub){
  return '<div class="sech"><span class="si">' + ico(icon) + '</span><div><h2>' + title + '</h2>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div></div>';
}
function segBar(act, cur, items){
  return '<div class="seg segx" role="tablist">' + items.map(function(i){
    return '<button role="tab" aria-selected="' + (cur === i[0]) + '" class="' + (cur === i[0] ? "on" : "") + '" data-act="' + act + '" data-v="' + i[0] + '">' + i[1] + '</button>';
  }).join("") + '</div>';
}
function phead(icon, title, sub, meta){
  return '<header class="phd"><span class="phi">' + ico(icon) + '</span><div class="phx"><h1 class="h1">' + title + '</h1>' + (sub ? '<p class="phs">' + sub + '</p>' : '') + '</div>' + (meta ? '<div class="phm">' + meta + '</div>' : '') + '</header>';
}
/* بطاقات تنقّل: أيقونة وعنوان، وإن كان العدد 5 يتمدد الأخير */
function tiles(act, cur, items, attr){
  attr = attr || "data-v";
  return '<div class="rtiles"' + (attr === "data-v" ? ' role="tablist"' : '') + '>' + items.map(function(i, n){
    var wide = (items.length % 3 === 2 && n === items.length - 1), on_ = (cur === i[0]);
    return '<button ' + (attr === "data-v" ? 'role="tab" aria-selected="' + on_ + '" ' : '') + 'class="rt' + (on_ ? " on" : "") + (wide ? " wide" : "") + '" data-act="' + act + '" ' + attr + '="' + i[0] + '"><span class="ri">' + ico(i[2]) + '</span><span>' + i[1] + '</span></button>';
  }).join("") + '</div>';
}
function chkBtn(act, on, text, sub, extra){
  return '<button class="chk" ' + (extra || "") + ' data-act="' + act + '" aria-pressed="' + on + '"><span class="ck' + (on ? " on" : "") + '">' + ico("check") + '</span><span><span class="b" style="display:block">' + text + '</span>' + (sub ? '<span class="xs muted" style="display:block">' + sub + '</span>' : '') + '</span></button>';
}

/* ============ سجلّي ============ */
function renderLog(){
  var h = phead("log", "سجلّي", "تقدّمك ونبضك وقياساتك في مكان واحد", syncHTML());
  h += '<div class="mt">' + segBar("lseg", UI.ls, [["ov", "نظرة عامة"], ["pu", "نبض الصباح"], ["wk", "قياسات الأسبوع"]]) + '</div>';
  if(UI.ls === "pu") h += logPulse();
  else if(UI.ls === "wk") h += logWeek();
  else h += logOverview();
  return h;
}

function logOverview(){
  var w = S.week, tot = allSessions(), full = TOTAL_WEEKS * 4, pct = Math.round(100 * tot / full);
  var fins = 0; for(var q = 1; q <= TOTAL_WEEKS; q++){ for(var dd = 1; dd <= 4; dd++){ if(on(K(q, dd, "f", 0))) fins += finMin(q); } }
  var h = '<section class="lhero mt"><div class="ring" style="--p:' + pct + '" role="img" aria-label="أنهيتِ ' + pct + '% من البرنامج"><b class="num">' + pct + '%</b></div>' +
    '<div class="grow"><div class="h3 num">' + tot + ' من ' + full + ' جلسة</div><div class="xs muted">أنتِ في الأسبوع ' + w + ' من ' + TOTAL_WEEKS + ' (' + wkd(w).name + ')</div><div class="xs muted num">جلسات هذا الأسبوع: ' + sessionsDone(w) + ' من 4</div></div></section>';
  h += '<div class="stats mt">' +
    '<div><span class="sti">' + ico("check") + '</span><div class="v num">' + tot + '</div><div class="l">جلسة مكتملة</div></div>' +
    '<div><span class="sti">' + ico("dumb") + '</span><div class="v num">' + prCount() + '</div><div class="l">وزن جديد</div></div>' +
    '<div><span class="sti">' + ico("heart") + '</span><div class="v num">' + fins + '</div><div class="l">دقيقة حرق للقلب</div></div></div>';

  /* بطاقة النبض المختصرة */
  var te = S.chk[dkey()], t = pulseTrend(), mini;
  if(te && te.p){ var bd = pulseBand(te.p); mini = '<span class="mi">' + ico("heart") + '</span><span class="grow"><span class="b" style="display:block">نبض اليوم <span class="num">' + te.p + '</span></span><span class="xs muted" style="display:block">' + bd.t + '</span></span>'; }
  else if(t.last){ mini = '<span class="mi">' + ico("heart") + '</span><span class="grow"><span class="b" style="display:block">سجّلي نبض اليوم</span><span class="xs muted" style="display:block">آخر قراءة: <span class="num">' + t.last.p + '</span> يوم ' + dfmt(t.last.k) + '</span></span>'; }
  else mini = '<span class="mi">' + ico("heart") + '</span><span class="grow"><span class="b" style="display:block">نبض الصباح</span><span class="xs muted" style="display:block">اكتبي رقمك ويخبرك الموقع ماذا يعني</span></span>';
  h += '<button class="pmini mt" data-act="lseg" data-v="pu">' + mini + ico("fwd", "chev-l") + '</button>';

  h += sech("log", "الجلسات في كل أسبوع", "الارتفاع الكامل = 4 جلسات") +
    '<section class="card col"><div class="wbars" role="img" aria-label="عدد الجلسات المكتملة في كل أسبوع من 4">' +
    WEEKS.map(function(x){
      var n = sessionsDone(x.n);
      return '<div class="wbar' + (x.n === w ? " cur" : "") + '"><b class="num">' + (n || "") + '</b><i class="' + (n ? "" : "z") + '" style="height:' + (n ? n * 25 : 3) + '%"></i><small class="num">' + x.n + '</small></div>';
    }).join("") + '</div><p class="xs muted">الأرقام تحت الأعمدة هي الأسابيع.</p></section>';

  var ids = Object.keys(S.log).filter(function(id){ return EX[id] && S.log[id].some(function(e){ return typeof e.kg === "number"; }); });
  h += sech("dumb", "أوزان الدمبلات", "تنتقل أوزانك تلقائياً بين الجلسات");
  if(!ids.length){
    h += '<section class="card"><p class="muted sm">ستظهر هنا أوزانك بعد أول جلسة. يُحفظ الوزن باسم الحركة، فينتقل تلقائياً بين الجلسات المشتركة وبين الأسابيع.</p></section>';
  }else{
    h += '<div class="group">' + ids.map(function(id){
      var arr = S.log[id].filter(function(e){ return typeof e.kg === "number"; }).sort(function(a, c){ return a.ts - c.ts; });
      var vals = arr.map(function(e){ return e.kg; }), first = vals[0], lastv = vals[vals.length - 1], diff = Math.round((lastv - first) * 10) / 10;
      var dtx = vals.length > 1 ? (diff > 0 ? "زيادة " + fmtKg(diff) + " كجم منذ البداية" : (diff < 0 ? "نقص " + fmtKg(-diff) + " كجم" : "ثابت")) : "أول تسجيل";
      var dcl = vals.length > 1 ? (diff > 0 ? "up" : (diff < 0 ? "dn" : "")) : "";
      return '<div class="exl"><div class="exi"><div class="b">' + EX[id].ar + '</div><div class="xs delta ' + dcl + '">' + dtx + '</div></div>' + sparkSVG(vals) + '<div class="exv num">' + fmtKg(lastv) + '<small>كجم</small></div></div>';
    }).join("") + '</div>';
  }

  h += sech("check", "الحفظ والنسخ", "") +
    '<section class="card col"><div class="row sp wrap">' + syncHTML() + '</div><p class="xs muted">' + saveHelp() + '</p>' +
    '<button class="btn quiet full" data-act="export">نسخ ملخص تقدّمي</button></section>';
  return h;
}
function saveHelp(){
  if(CL.st === "ok" || CL.st === "wait" || CL.st === "err") return "يُحفظ تقدمك تلقائياً على هذا الجهاز، ويُرسل نسخة إلى حسابك فتجدينه حين تفتحين الصفحة من جهاز آخر وأنتِ مسجّلة الدخول. عند تعارض جهازين أدمج البيانات ولا أمسح شيئاً.";
  if(CL.st === "ro") return "يُحفظ تقدمك تلقائياً على هذا الجهاز. للحفظ في الحساب يلزم أن تكون صلاحيتك على الصفحة «مشارِك» (Contributor) أو أعلى.";
  if(CL.na) return "يُحفظ تقدمك تلقائياً في هذا المتصفح وعلى هذا الجهاز فقط، ولا ينتقل إلى جهاز آخر. على آيفون: اضغطي زر المشاركة ثم «إضافة إلى الشاشة الرئيسية» ليفتح الموقع كتطبيق ويقلّ خطر ضياع تقدمك. وانسخي نسخة احتياطية من الإعدادات من وقت لآخر.";
  return "يُحفظ تقدمك تلقائياً على هذا الجهاز. الحفظ في الحساب يعمل فقط حين تفتحين الصفحة من claude.ai وأنتِ مسجّلة الدخول، وإلا يبقى على هذا المتصفح، فاحتفظي بنسخة احتياطية من الإعدادات.";
}

function logPulse(){
  var tk = dkey(), cur = S.chk[tk] || null, rows = chkRows(), t = pulseTrend();
  var pre = UI.pfill != null ? UI.pfill : (cur ? cur.p : ""); UI.pfill = null;
  var h = '<section class="card col mt"><div class="row sp wrap"><h2 class="h3">قراءة الاستيقاظ</h2>' + evChip("rhr") + '</div>' +
    '<p class="sm muted">قيسي نبضك صباحاً بعد الاستيقاظ وأنتِ هادئة وساكنة، جالسة أو مستلقية. اكتبي الرقم الآن، وسيخبرك الموقع ماذا يعني.</p>' +
    '<div class="fld"><label for="pdate">اليوم</label><input class="inp" type="date" id="pdate" value="' + tk + '" max="' + tk + '" data-act="pdate"></div>' +
    '<div class="fld"><label for="pbpm">نبضات القلب في الدقيقة</label><div class="row" style="gap:10px"><input class="inp num bigin" id="pbpm" type="number" inputmode="numeric" min="30" max="200" placeholder="مثلاً 72" value="' + esc(pre) + '" data-act="pbpm" style="flex:1;min-width:0"><button class="btn quiet" data-act="pcount">' + ico("heart") + 'عدّيني</button></div>' +
    '<span class="xs muted">لا تعرفين كيف تعدّين؟ اضغطي «عدّيني» وسأحسب لك.</span></div>' +
    '<div id="plive">' + (pre !== "" && +pre >= 30 ? bandHTML(+pre) : "") + '</div>' +
    '<div class="fld"><label for="psleep">ساعات نومك الليلة الماضية (اختياري)</label><input class="inp num" id="psleep" type="number" inputmode="decimal" step="0.5" min="0" max="16" placeholder="مثلاً 7" value="' + (cur && cur.s != null ? cur.s : "") + '" data-act="psleep"><span class="xs muted" id="pslnote">' + (cur && cur.s ? sleepNote(cur.s) : "") + '</span></div>' +
    '<div class="group">' + chkBtn("pflag", !!(cur && cur.f), "يوم غير معتاد", "مرض أو توتر أو قهوة قبل القياس أو قلة نوم. لا يدخل في المتوسط والمقارنة.", 'id="pflag"') + '</div>' +
    '<button class="btn full" data-act="psave">احفظي القراءة</button></section>';

  if(rows.length){
    var last = rows[rows.length - 1];
    h += sech("heart", "اتجاه نبضك", rows.length + " قراءة محفوظة") +
      '<section class="card col"><div class="tiles3"><div><div class="v num">' + last.p + '</div><div class="l">آخر قراءة</div></div>' +
      '<div><div class="v num">' + (t.avg7 != null ? t.avg7 : "—") + '</div><div class="l">متوسط آخر 7</div></div>' +
      '<div><div class="v num">' + (t.diff != null ? '<bdi dir="ltr">' + (t.diff > 0 ? "+" : (t.diff < 0 ? "\u2212" : "")) + Math.abs(t.diff) + '</bdi>' : "—") + '</div><div class="l">' + (t.diff != null ? "الفرق منذ البداية" : "الفرق (بعد 14 يوماً)") + '</div></div></div>' +
      pulseChart(rows) +
      (rows.length > 1 ? '<p class="xs muted">المظلّل هو النطاق الطبيعي (60 إلى 100). النقاط المفرغة أيام علّمتِها «غير معتادة».</p>' : '<p class="xs muted">سجّلي قراءة ثانية ليظهر الرسم.</p>') +
      '<p class="sm">' + trendText(t) + '</p>' +
      (t.sleep7 != null ? '<p class="xs muted num">متوسط نومك في آخر قراءاتك: ' + t.sleep7 + ' ساعة. ' + (t.sleep7 >= 7 ? "ضمن الموصى به." : "أقل من 7 ساعات الموصى بها للبالغين بانتظام.") + '</p>' : '') +
      '<div class="chips">' + evChip("trend", "كيف تُحسب؟ ") + evChip("rhrex", "هل ينزل بالتمرين؟ ") + '</div></section>';

    var all = rows.slice().reverse(), shown = UI.hall ? all : all.slice(0, 7);
    h += sech("list", "قراءاتي", "اضغطي «تعديل» لتغيير قراءة") +
      '<div class="group">' + shown.map(function(r){
        return '<div class="hrow"><div class="grow"><div class="b">' + dfmt(r.k) + '</div><div class="xs muted">' + pulseBand(r.p).t + (r.s != null ? " · نوم " + r.s + " س" : "") + (r.f ? " · غير معتاد" : "") + '</div></div><div class="hv num">' + r.p + '</div>' +
          '<button class="ibtn" data-act="pedit" data-k="' + r.k + '">تعديل</button><button class="ibtn" data-act="pdel" data-k="' + r.k + '" aria-label="حذف قراءة ' + dfmt(r.k) + '">حذف</button></div>';
      }).join("") + '</div>' +
      (all.length > 7 ? '<button class="btn quiet full mt" data-act="pall">' + (UI.hall ? "عرض آخر 7 فقط" : "عرض كل القراءات (" + all.length + ")") + '</button>' : '');
  }else{
    h += '<section class="card mt"><p class="sm muted">لم تُحفظ أي قراءة بعد. بعد أسبوعين ستظهر لك المقارنة بين أول أسبوع وآخر أسبوع، ورسم يوضّح الاتجاه.</p></section>';
  }
  h += '<div class="warn mt">هذه أداة لمتابعتك لنفسك وليست تشخيصاً. إن كان نبضك في الراحة فوق 100 بانتظام، أو أقل من 60 وأنتِ لستِ رياضية مدرَّبة، أو صاحبه دوار أو إغماء أو ضيق نفَس، فاذكري ذلك لطبيبتك.</div>';
  return h;
}

function logWeek(){
  var w = S.week, b = bodyOf(w);
  var h = sech("check", "قياسات الأسبوع " + w, "قيسي في الأسبوع 1 والأسبوع 8 على الأقل") +
    '<section class="card col"><div class="row sp wrap"><p class="sm muted">قارني نفسك بنفسك لا بأحد غيرك.</p><button class="chip ev-logic" data-act="ev" data-k="wall">الدليل: ' + LVS.logic + '</button></div>' +
    '<div class="lbl">اختبار الحائط (ظهرك وأردافك وكعباك على الحائط)</div><div class="group">' +
    ['الرأس يلامس الحائط دون رفع الذقن', 'الكتفان كلاهما يلامسان الحائط براحة', 'فراغ أسفل الظهر بسمك كفّ يدك تقريباً (لا أكثر)'].map(function(t, i){
      return chkBtn("wall", !!b.wall[i], t, "", 'data-i="' + i + '"');
    }).join("") + '</div>' +
    '<div class="fld"><label for="bnote">ملاحظة (اختياري)</label><textarea class="inp" id="bnote" data-act="note" placeholder="كيف تشعرين برقبتك وكتفيك؟">' + esc(b.note) + '</textarea></div>' +
    '<p class="xs muted">نبض الاستيقاظ صار له تبويب خاص يوميّ: «نبض الصباح».</p></section>';
  var legacy = WEEKS.some(function(x){ return S.body[x.n] && S.body[x.n].pulse !== "" && S.body[x.n].pulse != null; });
  var hist = WEEKS.filter(function(x){ var bb = S.body[x.n]; return bb && ((bb.pulse !== "" && bb.pulse != null) || wallScore(x.n) > 0); });
  if(hist.length){
    h += sech("list", "سجلّ الأسابيع", "") + '<div class="tbw"><table class="tb"><thead><tr><th>الأسبوع</th><th>اختبار الحائط</th>' + (legacy ? '<th>نبض أسبوعي (سابق)</th>' : '') + '</tr></thead><tbody>' +
      hist.map(function(x){ var bb = S.body[x.n]; return '<tr><td class="num">' + x.n + '</td><td class="num">' + wallScore(x.n) + ' من 3</td>' + (legacy ? '<td class="num">' + (bb.pulse === "" || bb.pulse == null ? "—" : esc(bb.pulse)) + '</td>' : '') + '</tr>'; }).join("") + '</tbody></table></div>';
  }
  return h;
}

function renderTools(){
  var h = phead("calc", "أدواتي", "حاسبات صغيرة مبنية على مصادر. كل بطاقة تذكر قوة دليلها، واضغطي على الشارة لترين المصدر.");

function sparkSVG(vals){
  if(vals.length < 1) return "";
  var W = 96, H = 34, p = 5, mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), rg = mx - mn || 1;
  var pts = vals.map(function(v, i){
    var x = vals.length === 1 ? W / 2 : p + (W - 2 * p) * i / (vals.length - 1);
    var y = vals.length === 1 || mx === mn ? H / 2 : H - p - (H - 2 * p) * (v - mn) / rg;
    return [x.toFixed(1), y.toFixed(1)];
  });
  var last = pts[pts.length - 1];
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">' + (pts.length > 1 ? '<polyline points="' + pts.map(function(q){ return q.join(","); }).join(" ") + '"/>' : '') + '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="4"/></svg>';
}
function bodyOf(w){ if(!S.body[w]) S.body[w] = {pulse:"", wall:[0, 0, 0], note:""}; return S.body[w]; }
function wallScore(w){ var b = S.body[w]; return b ? b.wall.reduce(function(a, c){ return a + (c ? 1 : 0); }, 0) : 0; }

/* ============ الإعدادات ============ */
function settingsHTML(){
  var pals = [["rose", "#a63f5c"], ["lilac", "#6b4aa0"], ["sage", "#3d7266"], ["sand", "#7d5f26"]];
  var names = {rose:"وردي", lilac:"لافندر", sage:"أخضر هادئ", sand:"رملي"};
  return '<div class="h2">الإعدادات</div>' +
    '<div class="fld"><span class="lbl">الحفظ</span><div>' + syncHTML() + '</div><p class="xs muted">' + saveHelp() + '</p></div>' +
    '<div class="fld"><span class="lbl">اللون</span><div class="pal">' + pals.map(function(p){ return '<button class="pdot' + (S.pal === p[0] ? " on" : "") + '" style="background:' + p[1] + '" data-act="pal" data-v="' + p[0] + '" aria-label="' + names[p[0]] + '" aria-pressed="' + (S.pal === p[0]) + '"></button>'; }).join("") + '</div></div>' +
    '<div class="fld"><span class="lbl">المظهر</span><div class="seg">' + [["auto", "تلقائي"], ["light", "فاتح"], ["dark", "داكن"]].map(function(t){ return '<button class="' + (S.theme === t[0] ? "on" : "") + '" data-act="theme" data-v="' + t[0] + '">' + t[1] + '</button>'; }).join("") + '</div></div>' +
    '<div class="fld"><span class="lbl">الصوت والاهتزاز في المؤقّت</span><div class="seg"><button class="' + (S.sound ? "on" : "") + '" data-act="sound" data-v="1">تشغيل</button><button class="' + (!S.sound ? "on" : "") + '" data-act="sound" data-v="0">إيقاف</button></div></div>' +
    '<div class="fld"><span class="lbl">نسخة احتياطية</span><p class="xs muted">نسخة يدوية تحتفظين بها بنفسك. انسخي النص التالي واحتفظي به، وألصقيه في الأسفل لاستعادته على أي جهاز.</p>' +
    '<textarea class="inp" id="bk" readonly style="min-height:70px;direction:ltr;font-size:11px">' + esc(cloudJson()) + '</textarea>' +
    '<button class="btn s quiet" data-act="copybk">نسخ النسخة الاحتياطية</button></div>' +
    '<div class="fld"><label class="lbl" for="rs">استعادة نسخة</label><textarea class="inp" id="rs" placeholder="ألصقي النسخة هنا" style="min-height:70px;direction:ltr;font-size:11px"></textarea><button class="btn s quiet" data-act="restore">استعادة</button></div>' +
    '<div class="fld"><span class="lbl">البدء من جديد</span><button class="btn s line" data-act="wipe" style="color:var(--acc)">' + (UI.wipe ? "اضغطي مرة ثانية لمسح كل التقدم" : "مسح كل التقدم") + '</button></div>';
}

function exportText(){
  var w = S.week, t = "لياقة أشواق · الأسبوع " + w + " (" + wkd(w).name + ")\n";
  t += "الجلسات: " + sessionsDone(w) + " من 4\n";
  t += "دقائق القلب: " + cardioMin(w) + " من 150\n";
  var ids = Object.keys(S.log).filter(function(id){ return EX[id]; });
  ids.forEach(function(id){
    var arr = S.log[id].filter(function(e){ return typeof e.kg === "number"; }).sort(function(a, b){ return a.ts - b.ts; });
    if(arr.length) t += EX[id].ar + ": " + fmtKg(arr[arr.length - 1].kg) + " كجم\n";
  });
  var pt = pulseTrend();
  if(pt.last) t += "نبض الصباح: آخر قراءة " + pt.last.p + " (" + dfmt(pt.last.k) + ")، متوسط آخر 7 قراءات " + pt.avg7 + "\n";
  var b = S.body[w]; if(b && b.pulse !== "" && b.pulse != null) t += "نبض أسبوعي (سابق): " + b.pulse + "\n";
  if(b) t += "اختبار الحائط: " + wallScore(w) + " من 3\n";
  return t;
}
function copyText(txt, ok){
  var done = function(){ toast(ok); };
  var fallback = function(){
    var ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast("حدّدي النص وانسخيه يدوياً"); }
    document.body.removeChild(ta);
  };
  try{ navigator.clipboard.writeText(txt).then(done, fallback); }catch(e){ fallback(); }
}

/* ============ الرسم والأحداث ============ */
function applyTheme(){
  var r = document.documentElement;
  r.setAttribute("data-pal", S.pal);
  if(S.theme === "light" || S.theme === "dark") r.setAttribute("data-theme", S.theme); else r.removeAttribute("data-theme");
}
function render(){
  applyTheme();
  var v = UI.view, h;
  if(v === "home") h = renderHome();
  else if(v === "day") h = renderDay(UI.w, UI.d);
  else if(v === "play") h = renderPlay(UI.w, UI.d);
  else if(v === "log") h = renderLog();
  else if(v === "tools") h = renderTools();
  else h = renderRef();
  document.body.classList.toggle("sessmode", v === "play");
  document.body.classList.toggle("sub", v === "day" || v === "play");
  $("#main").innerHTML = h;
  var tab = (v === "day" || v === "play") ? "home" : v;
  document.querySelectorAll(".nb").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-v") === tab); });
}
function goView(v){ UI.view = v; UI.wipe = false; render(); window.scrollTo(0, 0); }
function goDay(w, d){ UI.view = "day"; UI.w = w; UI.d = d; S.week = w; UI.stg[posKey(w, d)] = 0; save(); render(); window.scrollTo(0, 0); }
function openStage(w, d, n, tog){
  var k = posKey(w, d); UI.stg[k] = (tog && UI.stg[k] === n) ? 0 : n; render();
  if(UI.stg[k]){ var el = document.getElementById("stg-" + n); if(el) el.scrollIntoView({block:"start"}); }
}
function goPlay(w, d){
  UI.view = "play"; UI.w = w; UI.d = d; S.week = w;
  if(typeof S.pos[posKey(w, d)] !== "number") S.pos[posKey(w, d)] = firstOpenIdx(w, d);
  save(); render(); window.scrollTo(0, 0);
}
function stepGo(p){ setPos(UI.w, UI.d, p); save(); render(); window.scrollTo(0, 0); }

document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-act]");
  if(!t) {
    if(ev.target.id === "shade") closeSheet();
    return;
  }
  var a = t.getAttribute("data-act"), ds = t.dataset;
  if(a === "kgset" || a === "pulse" || a === "note") return;
  var w, d, id, i, r, k;
  switch(a){
    case "go": goView(ds.v); break;
    case "day": goDay(+ds.w, +ds.d); break;
    case "week": S.week = +ds.w; save(); UI.view = "home"; render(); break;
    case "play": goPlay(+ds.w, +ds.d); break;
    case "stage": openStage(+ds.w, +ds.d, +ds.n, true); break;
    case "stagego": openStage(+ds.w, +ds.d, +ds.n, false); break;
    case "tog": k = ds.key; UI.open[k] = !UI.open[k]; render(); break;
    case "bub":
      w = +ds.w; d = +ds.d; i = +ds.i; r = +ds.r; k = K(w, d, "s", i, r);
      var was = on(k); toggleKey(k);
      if(!was){
        id = DAYS[d - 1].ex[i];
        if(!EX[id].nokg && !entryOf(id, w, d)){ var le1 = lastEntry(id, w, d); if(le1) setKg(id, w, d, le1.kg); }
      }
      save(); render();
      if(!was){
        var Wb = wkd(w), nb = DAYS[d - 1].ex.length;
        if(i < nb - 1) startRest(15, "انتقلي إلى: " + stepName(w, d, {t:"set", i:i + 1, r:r}));
        else if(r < Wb.rounds - 1) startRest(40, "راحة، ثم الجولة " + (r + 2) + " من الحركة 1");
        else toast("انتهت الحركات، انتقلي للحرق");
      }
      break;
    case "nextwk": S.week = Math.min(TOTAL_WEEKS, S.week + 1); save(); goView("home"); toast("أسبوع جديد: " + wkd().name); break;
    case "closeses": tmStop(); goDay(UI.w, UI.d); break;
    case "prev": stepGo(curPos(UI.w, UI.d) - 1); break;
    case "next": stepGo(curPos(UI.w, UI.d) + 1); break;
    case "overview": openSheet(overviewHTML(UI.w, UI.d)); break;
    case "stepto": closeSheet(); stepGo(+ds.i); break;
    case "setdone":
      w = UI.w; d = UI.d;
      var stp = stepsOf(w, d), p0 = curPos(w, d), s0 = stp[p0], nx = stp[p0 + 1];
      if(s0 && s0.t === "set"){
        k = K(w, d, "s", s0.i, s0.r);
        if(!on(k)){
          S.done[k] = 1;
          id = DAYS[d - 1].ex[s0.i];
          if(!EX[id].nokg && !entryOf(id, w, d)){ var le = lastEntry(id, w, d); if(le) setKg(id, w, d, le.kg); }
        }
        stepGo(p0 + 1);
        if(nx && nx.t === "set"){
          if(nx.r === s0.r) startRest(15, "انتقلي إلى: " + stepName(w, d, nx));
          else startRest(40, "راحة، ثم الجولة " + (nx.r + 1) + ": " + stepName(w, d, nx));
        }else toast("انتهت الحركات، انتقلي للحرق");
      }
      break;
    case "setundo":
      w = UI.w; d = UI.d;
      var s1 = stepsOf(w, d)[curPos(w, d)];
      if(s1 && s1.t === "set"){ delete S.done[K(w, d, "s", s1.i, s1.r)]; save(); render(); }
      break;
    case "finskip": stepGo(curPos(UI.w, UI.d) + 1); break;
    case "kg":
      id = ds.id; w = +ds.w; d = +ds.d;
      var e0 = entryOf(id, w, d), le0 = lastEntry(id, w, d), base = e0 && typeof e0.kg === "number" ? e0.kg : (le0 ? le0.kg : 0);
      setKg(id, w, d, Math.max(0, Math.min(60, Math.round((base + parseFloat(ds.s)) * 2) / 2))); save(); render(); break;
    case "kgto": setKg(ds.id, UI.w, UI.d, parseFloat(ds.kg)); save(); render(); break;
    case "feel": setFeel(ds.id, +ds.w, +ds.d, ds.v); save(); render(); break;
    case "alt": S.alt[ds.id] = S.alt[ds.id] ? 0 : 1; save(); render(); break;
    case "hold":
      var Wh = wkd(UI.w); tmStart({segs:[{sec:3, kind:"ready", label:"استعدي"}, {sec:Wh.hold, kind:"work", label:EX[ds.id].ar, cue:"تنفّسي بانتظام"}], big:false, onDone:function(){ toast("أحسنتِ، سجّلي الجولة"); }}); break;
    case "chk": toggleKey(K(+ds.w, +ds.d, ds.b, +ds.j)); save(); render(); break;
    case "runitem": startItem(+ds.w, +ds.d, ds.b, +ds.j); break;
    case "steps": openSheet(itemSheet(ds.b, DAYS[+ds.d - 1].kind, +ds.j)); break;
    case "ev": openSheet('<div class="info">' + evBlock(ds.k) + '</div>'); break;
    case "finstart": startFinisher(+ds.w, +ds.d); break;
    case "finmark": toggleKey(K(UI.w, UI.d, "f", 0)); save(); render(); break;
    case "walk": if(!S.walks[S.week]) S.walks[S.week] = []; S.walks[S.week].push(+ds.min); save(); render(); toast("سُجّل مشي " + ds.min + " دقيقة"); break;
    case "unwalk": if(S.walks[S.week] && S.walks[S.week].length){ S.walks[S.week].pop(); save(); render(); } break;
    case "wall": var bb = bodyOf(S.week); bb.wall[+ds.i] = bb.wall[+ds.i] ? 0 : 1; save(); render(); break;
    case "gear": S.gear[ds.id] = S.gear[ds.id] ? 0 : 1; save(); render(); break;
    case "export": copyText(exportText(), "نُسخ الملخص"); break;
    case "settings": openSheet(settingsHTML()); break;
    case "closesheet": closeSheet(); break;
    case "pal": S.pal = ds.v; save(); applyTheme(); openSheet(settingsHTML()); break;
    case "theme": S.theme = ds.v; save(); applyTheme(); openSheet(settingsHTML()); break;
    case "sound": S.sound = ds.v === "1"; save(); openSheet(settingsHTML()); break;
    case "copybk": copyText(cloudJson(), "نُسخت النسخة الاحتياطية"); break;
    case "restore":
      try{
        var o = JSON.parse(($("#rs").value || "").trim());
        if(!o || typeof o !== "object" || !o.done || !o.log) throw new Error("bad");
        S = freshState();
        for(var q in o){ S[q] = o[q]; }
        save(); load(); closeSheet(); render(); toast("تمت الاستعادة");
      }catch(e){ toast("النص غير صالح، انسخيه كاملاً"); }
      break;
    case "wipe":
      if(!UI.wipe){ UI.wipe = true; openSheet(settingsHTML()); }
      else { var keep = {pal:S.pal, theme:S.theme, sound:S.sound, qi:S.qi, qbag:S.qbag, synced:S.synced}; S = freshState(); for(var kq in keep){ S[kq] = keep[kq]; } UI.wipe = false; UI.open = {}; save(); closeSheet(); goView("home"); toast("بدأتِ من جديد"); }
      break;
    case "lseg": UI.ls = ds.v; UI.hall = false; UI.view = "log"; render(); break;
    case "rseg": UI.rs = ds.v; render(); break;
    case "tjump": var tj = document.getElementById(ds.id); if(tj) tj.scrollIntoView({behavior:"smooth", block:"start"}); break;
    case "topulse": UI.ls = "pu"; closeSheet(); goView("log"); break;
    case "pcount": openSheet(countHTML()); break;
    case "ptap": pcTap(); break;
    case "pagain": openSheet(countHTML()); break;
    case "puse":
      UI.pfill = PC.bpm; UI.ls = "pu"; closeSheet(); goView("log");
      var pe = document.getElementById("pbpm"); if(pe && pe.scrollIntoView) pe.scrollIntoView({block:"center"});
      break;
    case "pflag":
      var fl = t.getAttribute("aria-pressed") === "true"; t.setAttribute("aria-pressed", String(!fl));
      var ckf = t.querySelector(".ck"); if(ckf) ckf.classList.toggle("on", !fl);
      break;
    case "psave":
      var pv = parseFloat(($("#pbpm") || {}).value), pd = ($("#pdate") || {}).value || dkey();
      if(!(pv >= 30 && pv <= 200)){ toast("اكتبي نبضاً بين 30 و200"); break; }
      if(pd > dkey()) pd = dkey();
      var psv = parseFloat(($("#psleep") || {}).value), ent = {p:Math.round(pv), u:Date.now()};
      if(psv > 0 && psv <= 16) ent.s = Math.round(psv * 2) / 2;
      if(($("#pflag") || t).getAttribute("aria-pressed") === "true") ent.f = 1;
      S.chk[pd] = ent; save(); render(); toast("حُفظت قراءة " + dfmt(pd));
      break;
    case "pedit":
      var ee = S.chk[ds.k]; if(!ee) break;
      var sd = $("#pdate"), sb = $("#pbpm"), ss = $("#psleep"), sf = $("#pflag");
      if(sd) sd.value = ds.k; if(sb) sb.value = ee.p; if(ss) ss.value = ee.s != null ? ee.s : "";
      if(sf){ sf.setAttribute("aria-pressed", String(!!ee.f)); var ck2 = sf.querySelector(".ck"); if(ck2) ck2.classList.toggle("on", !!ee.f); }
      var pl = $("#plive"); if(pl) pl.innerHTML = bandHTML(ee.p);
      var sn = $("#pslnote"); if(sn) sn.textContent = ee.s ? sleepNote(ee.s) : "";
      if(sb && sb.scrollIntoView) sb.scrollIntoView({block:"center"});
      break;
    case "pdel": delete S.chk[ds.k]; save(); render(); toast("حُذفت القراءة"); break;
    case "pall": UI.hall = !UI.hall; render(); break;
    case "tpause":
      if(TM){ if(TM.paused){ TM.end = Date.now() + TM.rem; TM.paused = false; } else { TM.rem = Math.max(0, TM.end - Date.now()); TM.paused = true; } tmBuild(); }
      break;
    case "tskip": tmNext(); break;
    case "tadd": if(TM){ if(TM.paused) TM.rem += 15000; else TM.end += 15000; tmPaint(); } break;
    case "tstop": tmStop(); break;
  }
});
document.addEventListener("change", function(ev){
  var t = ev.target;
  if(t.getAttribute && t.getAttribute("data-act") === "pdate"){
    var e0 = S.chk[t.value], sb0 = document.getElementById("pbpm"), ss0 = document.getElementById("psleep"), sf0 = document.getElementById("pflag"), pl0 = document.getElementById("plive"), sn0 = document.getElementById("pslnote");
    if(sb0) sb0.value = e0 ? e0.p : ""; if(ss0) ss0.value = e0 && e0.s != null ? e0.s : "";
    if(sf0){ sf0.setAttribute("aria-pressed", String(!!(e0 && e0.f))); var c0 = sf0.querySelector(".ck"); if(c0) c0.classList.toggle("on", !!(e0 && e0.f)); }
    if(pl0) pl0.innerHTML = e0 ? bandHTML(e0.p) : ""; if(sn0) sn0.textContent = e0 && e0.s ? sleepNote(e0.s) : "";
  }
  if(t.getAttribute && t.getAttribute("data-act") === "kgset"){
    var v = parseFloat(t.value);
    if(!isNaN(v) && v >= 0 && v <= 60){ setKg(t.dataset.id, +t.dataset.w, +t.dataset.d, Math.round(v * 2) / 2); save(); render(); }
  }
});
document.addEventListener("input", function(ev){
  var t = ev.target, a = t.getAttribute && t.getAttribute("data-act");
  if(a === "note"){ bodyOf(S.week).note = t.value; save(); }
  if(a === "pbpm"){
    var pl = document.getElementById("plive"), n = parseFloat(t.value);
    if(pl) pl.innerHTML = (String(t.value).length >= 2 && !isNaN(n)) ? bandHTML(n) : "";
  }
  if(a === "psleep"){ var sn = document.getElementById("pslnote"), hv = parseFloat(t.value); if(sn) sn.textContent = hv > 0 ? sleepNote(hv) : ""; }
  if(a === "age"){ var av = parseFloat(t.value); S.age = (av >= 18 && av <= 80) ? Math.round(av) : ""; save(); var zo = document.getElementById("zout"); if(zo) zo.innerHTML = zonesHTML(isNaN(av) ? 0 : av); }
  if(a === "wt"){ var wv = parseFloat(t.value); S.wt = (wv >= 30 && wv <= 200) ? Math.round(wv * 10) / 10 : ""; save(); var po = document.getElementById("pout"); if(po) po.innerHTML = proteinHTML(isNaN(wv) ? 0 : wv); }
});
document.addEventListener("keydown", function(ev){ if(ev.key === "Escape") closeSheet(); });

(function init(){
  document.documentElement.setAttribute("dir", "rtl");
  document.documentElement.setAttribute("lang", "ar");
  load();
  UI.w = S.week;
  UI.qi = pickQuote();
  render();
  cloudInit();
})();

</script>
</body>
